name: Build FlowState Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/flowstate-final-update
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # Records the resolved AndroidX/Kotlin graph in android/app/gradle.lockfile so
      # dependency scanners see exact versions. Locking is opt-in via -PfsWriteLocks,
      # so the APK build below is unaffected.
      - name: Generate dependency lockfile
        id: locks
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p android -PfsWriteLocks :app:resolveAndLockAll --write-locks 2>&1 | tee android/lock-generation.log

      - name: Commit lockfile to branch
        run: |
          git add -A -- 'android/gradle.lockfile' 'android/app/gradle.lockfile' 'android/lock-generation.log' || true
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore(android): record dependency lockfile [skip ci]"
            # checkout leaves a push build in detached HEAD, so name the branch explicitly.
            git push origin HEAD:refs/heads/feature/flowstate-final-update
          fi

      - name: Fail if lockfile generation failed
        if: steps.locks.outcome == 'failure'
        run: |
          echo "Dependency lockfile generation failed; diagnostics committed to android/lock-generation.log"
          exit 1

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowState-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
