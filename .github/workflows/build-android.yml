name: Build FlowState Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/flowstate-final-update
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # Records the resolved AndroidX/Kotlin graph in android/app/gradle.lockfile so
      # dependency scanners see exact versions. Locking is opt-in via -PfsWriteLocks,
      # so the APK build below is unaffected.
      - name: Generate dependency lockfile
        id: locks
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p android -PfsWriteLocks :app:resolveAndLockAll 2>&1 | tee android/lock-generation.log

      # Gradle cannot lock the plugins{} classpath, so the two build plugins are resolved as
      # ordinary dependencies in a separate lock-only build. This emits
      # android/plugin-lock/gradle.lockfile, which dependency scanners can read.
      # continue-on-error: a failure here must never affect the APK build below.
      - name: Generate plugin classpath lockfile
        id: pluginlocks
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p android/plugin-lock resolvePluginLocks --write-locks 2>&1 | tee /tmp/plugin-lock.log

      - name: Commit lockfile to branch
        run: |
          # Stage the whole android directory: `git add` aborts without staging anything when
          # even one pathspec does not exist yet, which previously silently skipped the commit.
          git add -A -- android/ || true
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore(android): record dependency lockfile [skip ci]"
            # checkout leaves a push build in detached HEAD, so name the branch explicitly.
            git push origin HEAD:refs/heads/feature/flowstate-final-update
          fi

      - name: Fail if lockfile generation failed
        if: steps.locks.outcome == 'failure'
        run: |
          echo "Dependency lockfile generation failed; diagnostics committed to android/lock-generation.log"
          exit 1

      # The APK step keeps its original command; output is captured only so a failure can be
      # read without API access to the job log. The job still fails on a failed build below.
      - name: Build debug APK
        id: apk
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p android assembleDebug 2>&1 | tee /tmp/apk-build.log

      - name: Record APK build diagnostics
        if: steps.apk.outcome == 'failure'
        run: |
          tail -n 500 /tmp/apk-build.log > android/apk-build.log || true
          git add -A -- android/apk-build.log || true
          if git diff --cached --quiet; then
            echo "No build log captured."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore(android): capture APK build failure log [skip ci]"
            git push origin HEAD:refs/heads/feature/flowstate-final-update
          fi

      - name: Fail the job when the APK build failed
        if: steps.apk.outcome == 'failure'
        run: |
          echo "assembleDebug failed; see android/apk-build.log"
          exit 1

      - name: Upload APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FlowState-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
