
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The web app is bundled into the APK so the tablet always runs the current UI,
// independent of which branch GitHub Pages publishes from.
def webAssetDir = file("$buildDir/generated/webassets")
def webAssetFiles = ['index.html', 'recurrence.js', 'sw.js', 'manifest.json']

android {
    namespace 'com.flowstate.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flowstate.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets.srcDirs += webAssetDir
        }
    }
}

tasks.register('copyWebAssets') {
    outputs.dir(webAssetDir)
    doLast {
        webAssetDir.mkdirs()
        webAssetFiles.each { name ->
            def src = file("${rootProject.projectDir}/../$name")
            if (src.exists()) {
                new File(webAssetDir, name).bytes = src.bytes
            } else {
                logger.warn("FlowState: missing web asset ${src}")
            }
        }
    }
}

tasks.named('preBuild').configure { dependsOn('copyWebAssets') }

dependencies {
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}

// Dependency locking is opt-in so the normal APK build is completely unaffected:
// without -PfsWriteLocks nothing below is configured and assembleDebug behaves as before.
// CI passes -PfsWriteLocks to record android/app/gradle.lockfile for vulnerability scanning.
if (project.hasProperty('fsWriteLocks')) {
    // The dependencyLocking extension is not guaranteed on an Android project, so look it up
    // defensively: --write-locks still records every configuration this task resolves.
    def lockHandler = project.extensions.findByName('dependencyLocking')
    if (lockHandler != null) {
        lockHandler.lockAllConfigurations()
    } else {
        logger.lifecycle('FlowState: dependencyLocking extension unavailable; --write-locks records resolved configurations.')
    }

    tasks.register('resolveAndLockAll') {
        description = 'Resolves all resolvable configurations so --write-locks can record them.'
        group = 'dependency locking'
        doLast {
            if (!gradle.startParameter.writeDependencyLocks) {
                throw new GradleException('Run with --write-locks to record dependency locks.')
            }
            configurations.findAll { it.canBeResolved }.each { cfg ->
                try {
                    cfg.resolve()
                } catch (Exception e) {
                    logger.warn("FlowState: skipping configuration '${cfg.name}': ${e.message}")
                }
            }
        }
    }
}
