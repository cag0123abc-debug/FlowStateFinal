
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The web app is bundled into the APK so the tablet always runs the current UI,
// independent of which branch GitHub Pages publishes from.
def webAssetDir = file("$buildDir/generated/webassets")
def webAssetFiles = ['index.html', 'recurrence.js', 'sw.js', 'manifest.json']

android {
    namespace 'com.flowstate.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flowstate.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        // AGP 8 stopped generating BuildConfig by default. NativeBridge exposes
        // BuildConfig.VERSION_NAME to the web layer, so it has to be generated.
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDirs += webAssetDir
        }
    }
}

tasks.register('copyWebAssets') {
    outputs.dir(webAssetDir)
    doLast {
        webAssetDir.mkdirs()
        webAssetFiles.each { name ->
            def src = file("${rootProject.projectDir}/../$name")
            if (src.exists()) {
                new File(webAssetDir, name).bytes = src.bytes
            } else {
                logger.warn("FlowState: missing web asset ${src}")
            }
        }
    }
}

tasks.named('preBuild').configure { dependsOn('copyWebAssets') }

dependencies {
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}

// Dependency locking is opt-in so the normal APK build is completely unaffected:
// without -PfsWriteLocks nothing below is configured and assembleDebug behaves as before.
// CI passes -PfsWriteLocks to record android/app/gradle.lockfile for vulnerability scanning.
if (project.hasProperty('fsWriteLocks')) {
    // AGP does not register Gradle's dependencyLocking extension, so --write-locks on its own
    // records nothing. Resolve the graph here and record the exact selected versions instead.
    tasks.register('resolveAndLockAll') {
        description = 'Resolves every resolvable configuration and records exact versions in gradle.lockfile.'
        group = 'dependency locking'
        doLast {
            def locked = [:]
            configurations.findAll { it.canBeResolved }.each { cfg ->
                try {
                    cfg.incoming.resolutionResult.allComponents.each { component ->
                        def id = component.id
                        if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                            def key = "${id.group}:${id.module}:${id.version}"
                            if (!locked.containsKey(key)) {
                                locked[key] = new TreeSet<String>()
                            }
                            locked[key].add(cfg.name)
                        }
                    }
                } catch (Exception e) {
                    logger.warn("FlowState: could not resolve configuration '${cfg.name}': ${e.message}")
                }
            }
            def lines = locked.keySet().sort().collect { key ->
                "${key}=${locked[key].join(',')}"
            }
            def target = file("$projectDir/gradle.lockfile")
            target.text = lines.join('\n') + (lines.isEmpty() ? '' : '\n')
            logger.lifecycle("FlowState: recorded ${lines.size()} dependency modules in ${target}")
            if (lines.isEmpty()) {
                throw new GradleException('No dependencies were resolved; refusing to write an empty lockfile.')
            }
        }
    }
}
