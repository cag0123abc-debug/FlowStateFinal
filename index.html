<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FlowState</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#3d5ba9">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&family=Lexend:wght@400;600&family=Caveat:wght@500;700&family=Nunito:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{--text:#1d2440;--cal:#3d5ba9;--font:system-ui,sans-serif;--fs:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);font-size:var(--fs);color:var(--text);background:#f5e6e1;transition:background .4s}
#blobs{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;display:flex;height:100%}
#rail{width:112px;flex:none;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0;background:rgba(70,60,75,.35);border-radius:0 46px 46px 0;overflow:hidden}
#rail button{width:84px;height:84px;flex:none;border-radius:50%;border:4px solid #3a3440;font-size:34px;background:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .25s;padding:0}
#rail button.active{transform:scale(1.12);border-color:#000;box-shadow:0 0 0 4px #ffd45c}
#rail .rail-label{font-size:11px;text-align:center;margin-top:-8px;opacity:.7;display:none}
#rail.collapsed{justify-content:flex-start}
#rail.collapsed button:not(.active){display:none}
#rail.drop button{animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px}
.logo{font-weight:900;font-size:30px;letter-spacing:1px;background:linear-gradient(90deg,#ff7a59,#c44cc9,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
.tr{display:flex;align-items:center;gap:12px}
#clock{background:#111;color:#fff;font-family:monospace;font-size:20px;padding:4px 10px;border-radius:6px}
header button{background:none;border:0;font-size:26px;position:relative;cursor:pointer;padding:4px}
#badge{position:absolute;top:-4px;right:-6px;background:#e33;color:#fff;border-radius:10px;font-size:12px;padding:0 5px;font-style:normal}
#badge:empty{display:none}
#main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
#view{flex:1;overflow:auto;padding:6px 18px 120px}
h1{margin:6px 0 12px;font-size:1.9em}
h2{margin:0 0 10px}
h3{margin:0 0 8px}
.panel{background:rgba(255,255,255,.85);border:3px solid var(--cal);border-radius:18px;padding:14px;margin-bottom:14px;overflow:auto}
.panel.tall{min-height:420px}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 5px rgba(0,0,0,.12);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card small{display:block;opacity:.7}
.card.done{opacity:.5;text-decoration:line-through}
.chk{width:34px;height:34px;flex:none;border-radius:8px;padding:0}
.grow{flex:1;min-width:0}
.empty{opacity:.6;font-style:italic}
.body{white-space:pre-wrap;max-height:260px;overflow:auto;background:#faf7f7;border-radius:10px;padding:8px;margin-top:6px}
button{font:inherit;border-radius:12px;border:2px solid var(--cal);background:#fff;padding:8px 14px;color:var(--text);cursor:pointer}
button.primary{background:var(--cal);color:#fff}
button.danger{color:#c00;border-color:#c00}
button.big{display:block;width:100%;margin:8px 0;font-size:1.1em;padding:14px;text-align:left}
button.chip{border-radius:20px;padding:6px 12px}
button.chip.on{background:var(--cal);color:#fff}
.sw{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid #fff}
.sw.on{outline:3px solid #000}
input,textarea,select{font:inherit;width:100%;padding:10px;border-radius:10px;border:2px solid #bbb;margin:6px 0;background:#fff;color:#222}
input[type=range],input[type=color],input[type=checkbox]{width:auto}
input[type=color]{height:40px;padding:2px}
textarea{min-height:170px}
label{display:block;margin:6px 0}
label.chip{display:inline-flex;align-items:center;gap:4px;width:auto;padding:6px 10px;border:2px solid var(--cal);border-radius:20px;margin:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
/* FAB Button */
#fab{position:absolute;right:22px;bottom:18px;width:74px;height:74px;border-radius:50%;background:#111;color:#fff;font-size:44px;border:4px solid #2fd46b;padding:0;line-height:1;z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}
#schoolBtn{position:absolute;right:112px;bottom:26px;width:62px;height:62px;border-radius:50%;background:#f7d28a;padding:0;font-size:30px;display:none;z-index:10}
#schoolBtn.on{display:block}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20}
#sheet.on{display:flex}
.box{background:#fbf7f6;color:var(--text);border-radius:20px;padding:20px;width:min(640px,92vw);max-height:88vh;overflow:auto;animation:pop .22s ease-out}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:14px;display:none;z-index:30;gap:12px;align-items:center}
#toast.on{display:flex}
#toast button{background:#fff;color:#222;border:0;padding:6px 12px}
#bubble{position:fixed;display:none;z-index:15;background:#fff;border:3px solid var(--cal);border-radius:18px;padding:12px 14px;width:260px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
#bubble p{margin:4px 0}
#bubble button{margin:4px 4px 0 0;padding:6px 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:20px 10px}
.blob{position:relative;aspect-ratio:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid rgba(0,0,0,.55);border-radius:58% 42% 55% 45%/46% 56% 44% 54%;transition:transform .4s,opacity .4s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.blob.pushed{transform:translateX(70px);opacity:.55}
.blob .ico{font-size:46px;display:flex;justify-content:center;align-items:center;width:76%;height:76%;min-width:0;min-height:0;overflow:hidden;border-radius:50%}
.blob .ico img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;aspect-ratio:1;object-fit:cover;object-position:center;border-radius:50%;flex:none}
.blob b{font-size:1.2em}
#rail img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:50%}
/* Home layout */
.home{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;align-items:start}
.sticky-col{display:flex;flex-direction:column;gap:14px}
.section-hdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0}
.section-hdr h3{margin:0}
.section-hdr .s-count{font-size:12px;opacity:.6;margin-left:6px}
.section-hdr .collapse-btn{background:none;border:none;font-size:18px;padding:0 4px;cursor:pointer}
.section-body.collapsed{display:none}
.drag-handle{cursor:grab;font-size:20px;padding:0 6px;opacity:.5;user-select:none}
.sticky{background:#fff6a8;padding:12px;box-shadow:0 4px 8px rgba(0,0,0,.2);border-radius:6px}
.sticky:nth-child(2){transform:rotate(1deg)}
.sticky:nth-child(3){transform:rotate(-1deg)}
.sticky.dragging{opacity:.5;border:2px dashed #aaa}
.cal{background:rgba(255,255,255,.92);border:4px solid var(--cal);border-radius:24px;padding:14px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead b{font-size:1.4em}
.calhead button{padding:4px 14px;font-size:1.3em}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk span{font-weight:700;opacity:.7}
.day{position:relative;padding:10px 0;border-radius:10px;background:#f4eeee;border:0;font-size:1.05em;cursor:pointer}
.day.today{outline:3px solid var(--cal)}
.day.sel{background:var(--cal);color:#fff}
.day i{position:absolute;bottom:2px;right:4px;font-size:10px;font-style:normal;background:#e33;color:#fff;border-radius:8px;padding:0 4px}
.day .day-add{position:absolute;top:1px;left:2px;font-size:11px;background:rgba(0,0,0,.12);border:none;border-radius:50%;width:16px;height:16px;padding:0;line-height:16px;display:none;cursor:pointer}
.day:hover .day-add{display:block}
.dl{margin:12px 0 4px}
.dayList{max-height:240px;overflow:auto}
.wkgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wkcol{text-align:left;min-height:150px;background:#f4eeee;border:0;padding:6px;font-size:.9em;overflow:hidden;cursor:pointer}
.wkcol.sel{outline:3px solid var(--cal)}
.wkit{font-size:.85em;background:#fff;border-radius:6px;padding:2px 4px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recur-icon{font-size:12px;margin-left:4px}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#view.enter{animation:viewIn .35s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
/* Full-screen note editor */
#note-overlay{position:fixed;inset:0;background:#fbf7f6;z-index:25;display:none;flex-direction:column;padding:0}
#note-overlay.on{display:flex}
#note-overlay .note-hdr{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:2px solid #ddd}
#note-overlay .note-hdr input{flex:1;font-size:1.3em;font-weight:700;border:none;background:transparent;padding:4px}
#note-overlay .note-body-wrap{flex:1;padding:12px 18px;display:flex;flex-direction:column;overflow:auto}
#note-overlay textarea{flex:1;border:none;background:transparent;resize:none;font-size:1.05em;min-height:200px}
#note-save-status{font-size:12px;opacity:.6;padding:4px 18px}
/* Focus mode full-screen */
#focus-overlay{position:fixed;inset:0;background:#111;z-index:26;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#focus-overlay.on{display:flex}
#focus-overlay .focus-label{font-size:28px;margin-bottom:16px;opacity:.8}
#focus-overlay .focus-time{font-size:72px;font-family:monospace;font-weight:700;margin:12px 0}
#focus-overlay .focus-sess{font-size:16px;opacity:.6;margin-bottom:24px}
#focus-overlay .focus-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
#focus-overlay button{background:#333;border-color:#555;color:#fff;font-size:1.1em;padding:12px 24px}
#focus-overlay button.primary{background:var(--cal)}



/* Themes & Visual Customization */
[data-theme="oled"]{--text:#f0f2f5;--cal:#5e81f4;background:#000000!important}
[data-theme="oled"] .panel,[data-theme="oled"] .card,[data-theme="oled"] .box{background:#111111!important;color:#ffffff!important;border-color:#2a2a2a!important}
[data-theme="oled"] .cal{background:#0a0a0a!important;border-color:#3d5ba9!important}
[data-theme="oled"] .day{background:#181818!important;color:#eee!important}
[data-theme="oled"] .day.today{outline:3px solid #5e81f4!important}
[data-theme="oled"] .day.sel{background:#5e81f4!important;color:#fff!important}
[data-theme="oled"] .sticky{background:#1a1a1a!important;color:#fff!important;border:1px solid #333!important}
[data-theme="oled"] .body{background:#1e1e1e!important;color:#ddd!important}
[data-theme="oled"] header{background:#000000!important}
[data-theme="oled"] #rail{background:rgba(20,20,25,.85)!important}
[data-theme="oled"] #rail button{background:#1a1a1a!important;color:#fff!important;border-color:#333!important}

[data-theme="sunset"]{--text:#2d1e2f;--cal:#e05638;background:#fceade!important}
[data-theme="neon"]{--text:#0cf;--cal:#f0f;background:#0d0221!important}
[data-theme="neon"] .panel,[data-theme="neon"] .card{background:#19053b!important;color:#0cf!important;border-color:#f0f!important}
[data-theme="forest"]{--text:#1c2d27;--cal:#2d6a4f;background:#e8f5e9!important}

/* Greeting Banner */
.greeting-banner{background:linear-gradient(135deg,rgba(61,91,169,.12),rgba(196,76,201,.12));border-radius:18px;padding:14px 18px;margin-bottom:14px;border:2px solid var(--cal);display:flex;justify-content:space-between;align-items:center}
.greeting-title{font-size:1.35em;font-weight:800;color:var(--text)}
.greeting-sub{font-size:.9em;opacity:.75}

/* Pinned task styling */
.card.pinned{border-left:5px solid #ffb300!important;background:rgba(255,248,225,.9)}
[data-theme="oled"] .card.pinned{background:#231e10!important;border-left:5px solid #ffb300!important}
.pin-btn{background:none;border:none;font-size:16px;cursor:pointer;padding:2px 6px;opacity:.7}
.pin-btn.active{opacity:1}

/* Task Tags & Estimated Time */
.task-tag{display:inline-block;padding:2px 7px;border-radius:12px;font-size:11px;font-weight:700;margin-right:4px;background:rgba(61,91,169,.15);color:var(--cal)}
.task-est{display:inline-block;padding:2px 6px;border-radius:6px;font-size:11px;background:#eee;color:#555;margin-right:4px}
[data-theme="oled"] .task-est{background:#2a2a2a;color:#aaa}

/* Habit Tracker Row */
.habit-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.habit-title{font-weight:600;font-size:.95em}
.habit-days{display:flex;gap:6px}
.habit-check{width:28px;height:28px;border-radius:8px;border:2px solid var(--cal);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:700;background:#fff;user-select:none}
.habit-check.done{background:var(--cal);color:#fff}
.habit-streak{font-size:12px;font-weight:700;color:#e65100;margin-left:6px}

/* Stopwatch / Study Timer */
.stopwatch-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.06);padding:3px 8px;border-radius:12px;font-size:12px;font-family:monospace;font-weight:700}
.sw-btn{padding:2px 6px;font-size:11px;border-radius:6px;cursor:pointer}

/* Grade Calculator */
.grade-table{width:100%;border-collapse:collapse;margin:10px 0}
.grade-table th,.grade-table td{padding:6px 8px;text-align:left;border-bottom:1px solid #ddd}
.grade-badge{font-size:1.1em;font-weight:800;padding:4px 10px;border-radius:12px;background:var(--cal);color:#fff;display:inline-block}

/* Agenda View */
.agenda-day{margin-bottom:12px}
.agenda-date{font-size:1em;font-weight:800;opacity:.8;padding-bottom:4px;border-bottom:2px solid var(--cal);margin-bottom:6px}

/* Trash Bin */
.trash-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#fff;border-radius:10px;margin-bottom:6px}

/* Photo Widgets */
.photo-widgets-wrap{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.photo-widgets-wrap.photo-pos-top{width:100%;margin-bottom:18px}
.photo-widget{position:relative;width:100%;border-radius:20px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.15);background:#222;user-select:none}
.photo-widget.landscape{aspect-ratio:16/9;max-height:360px}
.photo-widget.classic{aspect-ratio:4/3;max-height:380px}
.photo-widget.square{aspect-ratio:1/1;max-height:320px}
.photo-widget.banner{aspect-ratio:21/9;max-height:260px}
.photo-widget.compact{height:140px}
.photo-widget-img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;transition:opacity .35s ease-in-out;cursor:pointer}
.photo-widget-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:160px;background:rgba(255,255,255,.85);border:2px dashed var(--cal);border-radius:20px;color:var(--text);cursor:pointer;gap:6px}
.w-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;opacity:0;transition:opacity .2s;z-index:2;padding:0}
.photo-widget:hover .w-arrow,.photo-widget:active .w-arrow{opacity:1}
.w-prev{left:10px}
.w-next{right:10px}
.w-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2;padding:4px 8px;background:rgba(0,0,0,.35);border-radius:12px;backdrop-filter:blur(4px)}
.w-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;transition:background .2s,transform .2s}
.w-dot.active{background:#fff;transform:scale(1.25)}
.pw-thumbs-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;max-height:220px;overflow-y:auto;padding:4px}
.pw-thumb-item{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:2px solid #ccc;flex:none}
.pw-thumb-item img{width:100%;height:100%;object-fit:cover}
.pw-thumb-del{position:absolute;top:2px;right:2px;background:rgba(200,0,0,.85);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
/* Offline banner */
#offline-banner{position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;text-align:center;padding:8px;z-index:50;display:none;font-size:14px}
#offline-banner.on{display:block}
/* Class drag */
.cls-card{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.cls-card.dragging-over{border:2px dashed var(--cal)}
/* Tablet layout */
@media(min-width:1024px){
  .home{grid-template-columns:1fr 1.3fr 1fr}
  .box{width:min(800px,95vw)}
  #rail .rail-label{display:block}
  .wk span,.day{font-size:1.1em}
  .cols{grid-template-columns:1.2fr 1fr}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-row label{margin-top:0}
}
/* Quick-add sheet */
#quick-add-sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:21}
#quick-add-sheet.on{display:flex}
#quick-add-box{background:#fbf7f6;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:640px;animation:pop .22s ease-out}

/* ===== MOVIEHUB ===== */
.mh-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.mh-search-wrap{position:relative;display:flex;align-items:center;margin-bottom:12px}
.mh-search-wrap input{padding:11px 38px 11px 38px;border-radius:14px;border:2px solid var(--cal);margin:0;background:rgba(255,255,255,.92);font-size:1em}
.mh-search-ico{position:absolute;left:12px;font-size:17px;pointer-events:none;opacity:.65}
.mh-search-clr{position:absolute;right:8px;border:none;background:rgba(0,0,0,.1);border-radius:50%;width:26px;height:26px;padding:0;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mh-folders{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.mh-folder-chip{border-radius:20px;padding:7px 14px;font-size:.92em;border:2px solid var(--cal);background:rgba(255,255,255,.88);display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
.mh-folder-chip.on{background:var(--cal);color:#fff}
.mh-select-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--cal);color:#fff;padding:10px 14px;border-radius:14px;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.mh-select-bar button{border-color:rgba(255,255,255,.5);padding:6px 12px;font-size:.9em}
.mh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
@media(min-width:768px){.mh-grid{grid-template-columns:repeat(auto-fill,minmax(174px,1fr));gap:18px}}
.mh-card{position:relative;background:rgba(255,255,255,.92);border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.12);border:3px solid transparent;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;display:flex;flex-direction:column;user-select:none}
.mh-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.mh-card.selected{border-color:var(--cal);box-shadow:0 0 0 3px rgba(61,91,169,.32)}
.mh-poster{position:relative;width:100%;aspect-ratio:2/3;background:linear-gradient(145deg,#1d2440,#3a2352);display:flex;align-items:center;justify-content:center;overflow:hidden}
.mh-poster img{width:100%;height:100%;object-fit:cover;display:block}
.mh-poster-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.88);gap:6px;padding:12px;text-align:center}
.mh-poster-ph span{font-size:44px}

<script>
/* ===== CONSTANTS & DEFAULTS ===== */
const clone=o=>JSON.parse(JSON.stringify(o));
const KEY='flowstate-v3';
const OLD_KEY='flowstate-v2';
const PAL=['#ff8fa3','#8fd3a8','#f7c77a','#9db4f0','#c39bf0','#7fd6e8','#f49a6b','#f9b4c8','#b4f4c8','#b4d9f9','#f9e4b4','#e4b4f9'];
const DEF={
  items:[],
  classes:[{id:'math',name:'Math',icon:'➕',color:'#ff8fa3',order:0,customColor:'',collapsed:false,grades:[]}],
  notifs:[],dnd:false,fired:{},
  bookmarks:[],widgets:[],focusHistory:[],
  movies:[],movieFolders:[],
  habits:[
    {id:'h_deyc',title:'Review DEYC Updates',days:{}},
    {id:'h_plan',title:'Plan Next Day',days:{}},
    {id:'h_read',title:'Read & Study 20m',days:{}}
  ],
  trash:[],
  settings:{
    speed:1,reduce:false,font:'system-ui, sans-serif',fs:16,text:'#1d2440',cal:'#3d5ba9',
    theme:'default',oled:false,userName:'',
    bg:{home:'#f5e6e1',school:'#f7dede',work:'#dfe7f5',deyc:'#dcf2e2',personal:'#e5dcf5',moviehub:'#dde3f4'},
    sectionOrder:['agenda','habits','overdue','today','soon','notes','recs'],
    hiddenSections:[],
    defaultTab:'home',
    animations:true,
    focusWork:25,focusBreak:5
  }
};

function migrateV2(){
  try{
    const raw=localStorage.getItem(OLD_KEY);
    if(!raw)return null;
    const v2=JSON.parse(raw);
    if(!v2||!v2.items)return null;
    const d=clone(DEF);
    Object.assign(d,v2);
    d.settings=Object.assign(clone(DEF.settings),v2.settings||{},{bg:Object.assign(clone(DEF.settings.bg),(v2.settings||{}).bg||{})});
    // Add new item fields
    d.items=d.items.map(i=>Object.assign({rrule:null,exdates:[],seriesId:null,expanded:false,lastEdited:null},i));
    // Add new class fields
    d.classes=d.classes.map((c,idx)=>Object.assign({order:idx,customColor:'',collapsed:false},c));
    // New top-level fields
    d.bookmarks=d.bookmarks||[];d.widgets=d.widgets||[];d.focusHistory=d.focusHistory||[];d.movies=d.movies||[];d.movieFolders=d.movieFolders||[];d.habits=d.habits||[{id:'h_deyc',title:'Review DEYC Updates',days:{}},{id:'h_plan',title:'Plan Next Day',days:{}},{id:'h_read',title:'Read & Study 20m',days:{}}];d.trash=d.trash||[];d.classes=(d.classes||[]).map(c=>Object.assign({grades:[]},c));if(!d.settings.theme)d.settings.theme='default';
    // New settings fields
    if(!d.settings.sectionOrder)d.settings.sectionOrder=['overdue','today','soon','notes','recs'];
    if(!d.settings.hiddenSections)d.settings.hiddenSections=[];
    if(!d.settings.defaultTab)d.settings.defaultTab='home';
    if(d.settings.animations===undefined)d.settings.animations=true;
    if(!d.settings.focusWork)d.settings.focusWork=25;
    if(!d.settings.focusBreak)d.settings.focusBreak=5;
    localStorage.setItem(KEY,JSON.stringify(d));
    return d;
  }catch(e){return null}
}

function load(){
  // Try v3 first
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(x&&x.items){
      const d=clone(DEF);
      Object.assign(d,x);
      d.settings=Object.assign(clone(DEF.settings),x.settings||{},{bg:Object.assign(clone(DEF.settings.bg),(x.settings||{}).bg||{})});
      if(!d.bookmarks)d.bookmarks=[];if(!d.widgets)d.widgets=[];if(!d.focusHistory)d.focusHistory=[];
      if(!d.movies)d.movies=[];if(!d.movieFolders)d.movieFolders=[];
      if(!d.settings.sectionOrder)d.settings.sectionOrder=['overdue','today','soon','notes','recs'];
      if(!d.settings.hiddenSections)d.settings.hiddenSections=[];
      if(!d.settings.focusWork)d.settings.focusWork=25;
      if(!d.settings.focusBreak)d.settings.focusBreak=5;
      return d;
    }
  }catch(e){}
  // Try migrating from v2
  const migrated=migrateV2();
  if(migrated)return migrated;
  return clone(DEF);
}

let D=load();
const S={tab:D.settings.defaultTab||'home',cls:null,collapsed:false,bubble:null,drop:false,sel:'',month:null,view:'month'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const uid=()=>Math.random().toString(36).slice(2,10);
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=s=>new Date(s).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const fmtDur=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const byC=(a,b)=>b.created-a.created;
const val=k=>$('#f-'+k)?.value??'';
const CATS={home:'Home',school:'School',work:'Work',deyc:'DEYC',personal:'Personal',moviehub:'MovieHub'};
const BGK=['home','school','work','deyc','personal','moviehub'];
const RAIL=[['home','🏠','Home'],['school','🎓','School'],['work','💼','Work'],['deyc','🤝','DEYC'],['personal','🌟','Personal'],['moviehub','🎬','MovieHub']];
const LISTS=['Must Watch','Must Read','Must Play','To Do','Websites','Potential Ideas','Games to Play'];
const LABEL={event:'Event',homework:'Homework',test:'Test',summary:'Summary',project:'Project',note:'Note',bucket:'List item',recording:'Recording'};
let FORM={},REC=null,RC='school',CCOL=PAL[0],UNDO=null,TT=null,CONF=null;
let NOTE_EDIT_ID=null,NOTE_SAVE_TT=null;
S.sel=dk(new Date());
S.month=new Date(new Date().getFullYear(),new Date().getMonth(),1);

function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Storage is full. Try a smaller image or remove one.')}}

/* ===== GOOGLE SYNC ===== */
const GOOGLE_SYNC_URL='https://script.google.com/macros/s/AKfycbxF-v0PypnUbO-h9mPWKc5E8LIjJUe2WosWHY2C-Le2j4lpYwtdY1EBE06u0Dh64vP4Yw/exec';
const GOOGLE_SYNC_TOKEN='flowstate-2026-private-7Kq9m2';
function googlePayload(action,item,id){
  const payload={token:GOOGLE_SYNC_TOKEN,action};
  if(item){const copy={...item};if(copy.due){const d=new Date(copy.due);copy.due=isNaN(d)?null:d.toISOString()}payload.item=copy;}
  if(id)payload.id=id;
  return JSON.stringify(payload);
}
function sendGoogleSync(action,item,id){
  if(!D.settings.googleSync)return;
  const body=googlePayload(action,item,id);
  if(!navigator.onLine){D.settings.pendingGoogleSync=D.settings.pendingGoogleSync||[];D.settings.pendingGoogleSync.push(body);save();return;}
  fetch(GOOGLE_SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body,keepalive:true})
    .catch(()=>{D.settings.pendingGoogleSync=D.settings.pendingGoogleSync||[];D.settings.pendingGoogleSync.push(body);save()});
}
function flushGoogleSync(){
  if(!D.settings.googleSync||!navigator.onLine)return;
  const q=D.settings.pendingGoogleSync||[];if(!q.length)return;
  D.settings.pendingGoogleSync=[];save();
  q.forEach(body=>fetch(GOOGLE_SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body,keepalive:true}).catch(()=>{D.settings.pendingGoogleSync=D.settings.pendingGoogleSync||[];D.settings.pendingGoogleSync.push(body);save()}));
}
function connectGoogleSync(){D.settings.googleSync=true;save();D.items.slice().forEach(item=>sendGoogleSync('upsert',item));render();toast('Google sync requests sent for '+D.items.length+' items')}
function disconnectGoogleSync(){D.settings.googleSync=false;save();render();toast('Automatic Google sync paused')}
function testGoogleSync(){
  if(!D.settings.googleSync){toast('Connect Google sync first');return}
  fetch(GOOGLE_SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({token:GOOGLE_SYNC_TOKEN,action:'test'}),keepalive:true})
    .then(()=>toast('Test request sent. Check your Gmail inbox for the FlowState test email.'))
    .catch(()=>toast('Could not send the test request. Check your connection.'));
}
window.addEventListener('online',()=>{flushGoogleSync();$('#offline-banner').classList.remove('on')});
window.addEventListener('offline',()=>$('#offline-banner').classList.add('on'));
if(!navigator.onLine)$('#offline-banner').classList.add('on');

/* ===== RECURRING EVENTS ===== */
function parseRRule(str){
  if(!str)return null;
  const r={};
  str.split(';').forEach(p=>{const[k,v]=p.split('=');if(k&&v)r[k]=v});
  return r;
}
function expandRecurring(item,startDate,endDate){
  if(!item.rrule)return[];
  const rr=parseRRule(item.rrule);
  if(!rr||!rr.FREQ)return[];
  const freq=rr.FREQ;
  const interval=Math.max(1,parseInt(rr.INTERVAL,10)||1);
  const count=rr.COUNT?parseInt(rr.COUNT,10):null;
  const until=rr.UNTIL?new Date(rr.UNTIL):null;
  const byday=rr.BYDAY?rr.BYDAY.split(','):null;
  const exdates=item.exdates||[];
  const baseDate=new Date(item.due||item.created);
  if(isNaN(baseDate))return[];
  const results=[];
  let cur=new Date(baseDate);
  let iterations=0;
  const maxIter=500;
  while(iterations<maxIter){
    iterations++;
    if(count!==null&&results.length>=count)break;
    if(until&&cur>until)break;
    if(cur>endDate)break;
    let valid=true;
    if(freq==='WEEKLY'&&byday){
      const days=['SU','MO','TU','WE','TH','FR','SA'];
      valid=byday.includes(days[cur.getDay()]);
    }
    if(valid&&cur>=startDate&&cur<=endDate){
      const curKey=dk(cur);
      if(!exdates.includes(curKey)&&!(cur.getTime()===baseDate.getTime())){
        results.push({...item,id:item.id+'_'+curKey,seriesId:item.id,due:cur.toISOString(),_virtual:true});
      }
    }
    const next=new Date(cur);
    if(freq==='DAILY')next.setDate(next.getDate()+interval);
    else if(freq==='WEEKLY'){
      if(interval>1){
        next.setDate(next.getDate()+7*interval);
      } else {
        next.setDate(next.getDate()+1);
      }
    }
    else if(freq==='MONTHLY')next.setMonth(next.getMonth()+interval);
    else if(freq==='YEARLY')next.setFullYear(next.getFullYear()+interval);
    else break;
    cur=next;
  }
  return results;
}
function getItemsForDay(dayKey){
  const base=D.items.filter(i=>i.due&&dk(new Date(i.due))===dayKey);
  const startDate=new Date(dayKey+'T00:00');
  const endDate=new Date(dayKey+'T23:59');
  const recurring=D.items.flatMap(i=>i.rrule?expandRecurring(i,startDate,endDate):[]);
  return[...base,...recurring].sort((a,b)=>new Date(a.due)-new Date(b.due));
}
function getAllItemsInRange(startDate,endDate){
  const base=D.items.filter(i=>i.due&&new Date(i.due)>=startDate&&new Date(i.due)<=endDate);
  const recurring=D.items.flatMap(i=>i.rrule?expandRecurring(i,startDate,endDate):[]);
  return[...base,...recurring];
}

/* ===== HELPERS ===== */
function clsName(id){const c=D.classes.find(x=>x.id===id);return c?c.name:''}
function sheet(h){$('#sheetBody').innerHTML=h;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
function toast(msg,undo){
  $('#tmsg').textContent=msg;UNDO=undo||null;
  $('#tundo').style.display=undo?'':'none';

function viewHome(){
  const now=Date.now(),m=S.month,days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),first=new Date(m.getFullYear(),m.getMonth(),1).getDay();
  const notes=D.items.filter(i=>i.type==='note').sort(byC).slice(0,3);
  const recs=D.items.filter(i=>i.type==='recording').sort(byC).slice(0,3);
  const overdue=D.items.filter(i=>!i.done&&i.due&&new Date(i.due).getTime()<now).sort((a,b)=>new Date(a.due)-new Date(b.due));
  const todayItems=D.items.filter(i=>!i.done&&i.due&&dk(new Date(i.due))===dk(new Date())).sort((a,b)=>new Date(a.due)-new Date(b.due));
  const soon=D.items.filter(i=>(i.type==='homework'||i.type==='test')&&!i.done&&i.due&&(new Date(i.due)-now)>-864e5&&(new Date(i.due)-now)<6048e5).sort((a,b)=>new Date(a.due)-new Date(b.due));

  // Calendar counts including recurring
  const calStart=new Date(m.getFullYear(),m.getMonth(),1);
  const calEnd=new Date(m.getFullYear(),m.getMonth()+1,0);
  calEnd.setHours(23,59,59);
  const rangeItems=getAllItemsInRange(calStart,calEnd);
  const counts={};
  rangeItems.forEach(i=>{if(i.due){const k=dk(new Date(i.due));counts[k]=(counts[k]||0)+1}});
  const today=dk(new Date());
  let cells='';for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=days;d++){
    const k=dk(new Date(m.getFullYear(),m.getMonth(),d));
    cells+=`<div style="position:relative"><button class="day${k===today?' today':''}${k===S.sel?' sel':''}" onclick="selDay('${k}')">${d}${counts[k]?`<i>${counts[k]}</i>`:''}</button><button class="day-add" onclick="quickAddForDay('${k}')">+</button></div>`;
  }
  const dayItems=getItemsForDay(S.sel);

  // Sorting with pinned first
  const sortPinned=(arr)=>[...arr].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));

  // Greeting
  const hour=new Date().getHours();
  const timeWord=hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';
  const uName=D.settings.userName?`, ${esc(D.settings.userName)}`:'';

  const greetingHtml=`<div class="greeting-banner">

  // Section order
  const sectionOrder=D.settings.sectionOrder||['agenda','habits','overdue','today','soon','notes','recs'];
  const sections={
    agenda:sectionHtml('agenda','Upcoming Agenda (Next 7 Days)',[],renderUpcomingAgenda(7)),
    habits:sectionHtml('habits','Daily Habits & Streaks',[],renderHabitsSection()),
    overdue:sectionHtml('overdue','Overdue',sortPinned(overdue)),
    today:sectionHtml('today','Due Today',sortPinned(todayItems)),
    soon:sectionHtml('soon','Due Date Approaching',sortPinned(soon)),
    notes:sectionHtml('notes','Recent Notes',notes,isSectionHidden('notes')?'':list(notes)+(notes.length?`<div class="row"><button onclick="go2('personal')">View all notes</button></div>`:'')),
    recs:sectionHtml('recs','Recent Recordings',recs)
  };

  return `${renderPhotoWidgets('top')}
  ${greetingHtml}
  <div class="home">
    <div class="sticky-col" id="sections-col">
      ${renderPhotoWidgets('left_top')}
      ${sectionOrder.map(k=>sections[k]||'').join('')}
      ${renderPhotoWidgets('left_bottom')}

    <div class="cal-col">
      ${renderPhotoWidgets('right_top')}

        <div class="calhead">
          <button onclick="moveMonth(-1)">‹</button>

function moveMonth(n){

function weekGrid(){

/* ===== SECTION DRAG & DROP ===== */
function initSectionDrag(){
  const col=document.getElementById('sections-col');
  if(!col)return;
  let dragEl=null,dragKey=null;
  col.querySelectorAll('.sticky[data-section]').forEach(el=>{
    const handle=el.querySelector('.drag-handle');
    if(!handle)return;
    handle.addEventListener('touchstart',e=>{
      e.stopPropagation();
      dragEl=el;dragKey=el.dataset.section;el.classList.add('dragging');
    },{passive:true});
  });
  col.addEventListener('touchmove',e=>{
    if(!dragEl)return;
    const touch=e.touches[0];
    const over=document.elementFromPoint(touch.clientX,touch.clientY)?.closest('.sticky[data-section]');
    col.querySelectorAll('.sticky[data-section]').forEach(x=>x.classList.remove('dragging-over'));
    if(over&&over!==dragEl)over.classList.add('dragging-over');
  },{passive:true});
  col.addEventListener('touchend',e=>{
    if(!dragEl)return;
    const touch=e.changedTouches[0];
    const over=document.elementFromPoint(touch.clientX,touch.clientY)?.closest('.sticky[data-section]');
    dragEl.classList.remove('dragging');
    col.querySelectorAll('.sticky[data-section]').forEach(x=>x.classList.remove('dragging-over'));
    if(over&&over!==dragEl&&dragKey&&over.dataset.section){
      const ord=D.settings.sectionOrder||['overdue','today','soon','notes','recs'];
      const ia=ord.indexOf(dragKey),ib=ord.indexOf(over.dataset.section);
      if(ia>=0&&ib>=0){ord.splice(ia,1);ord.splice(ib,0,dragKey);D.settings.sectionOrder=ord;save();render();}
    }
    dragEl=null;dragKey=null;
  });
}

function renderPhotoWidget(w){

          <div class="w-dots" id="w-dots-${w.id}">
            ${imgs.map((_,i)=>`<span class="w-dot${i===idx?' active':''}" onclick="setWidgetPhoto('${w.id}',${i})"></span>`).join('')}
          </div>
        `:''}
      `:`
        <div class="photo-widget-empty" onclick="go2('settings')">

function startWidgetRotations(){
  stopWidgetRotations();
  if(!D.widgets||!D.widgets.length)return;
  D.widgets.forEach(w=>{
    if(w.images&&w.images.length>1){
      const sec=Math.max(2,parseInt(w.interval,10)||5);
      WIDGET_TIMERS[w.id]=setInterval(()=>{
        advanceWidgetPhoto(w.id,1);
      },sec*1000);
    }
  });
}

function stopWidgetRotations(){
  Object.values(WIDGET_TIMERS).forEach(clearInterval);
  WIDGET_TIMERS={};
}

function advanceWidgetPhoto(widgetId,dir){
  const w=(D.widgets||[]).find(x=>x.id===widgetId);
  if(!w||!w.images||w.images.length<=1)return;
  w._idx=((w._idx||0)+dir+w.images.length)%w.images.length;
  updateWidgetPhotoDisplay(w);
}

function setWidgetPhoto(widgetId,index){
  const w=(D.widgets||[]).find(x=>x.id===widgetId);
  if(!w||!w.images||index<0||index>=w.images.length)return;
  w._idx=index;
  updateWidgetPhotoDisplay(w);
}

function updateWidgetPhotoDisplay(w){
  const imgEl=document.getElementById(`w-img-${w.id}`);
  const dotsEl=document.getElementById(`w-dots-${w.id}`);
  if(imgEl&&w.images&&w.images.length){
    imgEl.style.opacity='0';
    setTimeout(()=>{
      imgEl.src=w.images[w._idx||0];
      imgEl.style.opacity='1';
    },200);
  }
  if(dotsEl){
    const dots=dotsEl.querySelectorAll('.w-dot');
    dots.forEach((dot,idx)=>{
      dot.classList.toggle('active',idx===(w._idx||0));
    });
  }
}

function compressWidgetImage(file,callback){
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const maxDim=900;
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){
        if(w>h){h=Math.round(h*(maxDim/w));w=maxDim;}
        else{w=Math.round(w*(maxDim/h));h=maxDim;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      callback(canvas.toDataURL('image/jpeg',0.75));
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

function renderPwThumbsHtml(){
  if(!CURRENT_PW_IMAGES.length){
    return '<p class="empty" style="width:100%">No photos added yet. Tap Choose Files above to pick images.</p>';
  }
  return CURRENT_PW_IMAGES.map((src,idx)=>`
    <div class="pw-thumb-item">
      <img src="${src}">
      <button class="pw-thumb-del" onclick="removePwThumb(${idx})" title="Remove">✕</button>
    </div>
  `).join('');
}

function removePwThumb(idx){
  CURRENT_PW_IMAGES.splice(idx,1);
  const container=$('#pw-thumbs');
  if(container)container.innerHTML=renderPwThumbsHtml();
}

function handleWidgetPhotoUpload(fileList){
  if(!fileList||!fileList.length)return;
  const files=Array.from(fileList);
  toast(`Compressing ${files.length} photo(s)...`);
  let remaining=files.length;
  files.forEach(file=>{
    compressWidgetImage(file,dataUrl=>{
      CURRENT_PW_IMAGES.push(dataUrl);
      remaining--;
      if(remaining<=0){
        const container=$('#pw-thumbs');
        if(container)container.innerHTML=renderPwThumbsHtml();
        toast(`${files.length} photo(s) added!`);
      }
    });
  });
}

function savePhotoWidget(){
  const name=($('#pw-name')?.value||'').trim()||'Photo Widget';
  const position=$('#pw-pos')?.value||'top';
  const interval=parseInt($('#pw-interval')?.value||'5',10);
  const aspectRatio=$('#pw-aspect')?.value||'landscape';

  if(!CURRENT_PW_IMAGES.length){
    return toast('Please select at least one photo for the widget');
  }

  if(EDITING_PW_ID){
    const w=(D.widgets||[]).find(x=>x.id===EDITING_PW_ID);
    if(w){
      w.name=name;
      w.position=position;
      w.interval=interval;
      w.aspectRatio=aspectRatio;
      w.images=CURRENT_PW_IMAGES;
      w._idx=0;
    }
  } else {
    D.widgets=D.widgets||[];
    D.widgets.push({
      id:uid(),
      name,
      position,
      interval,
      aspectRatio,
      images:CURRENT_PW_IMAGES,
      _idx:0,
      order:D.widgets.length
    });
  }

  save();
  closeSheet();
  render();
  toast('Photo widget saved!');
}

function deletePhotoWidget(id){
  confirmSheet('Delete this photo widget?',()=>{
    D.widgets=(D.widgets||[]).filter(w=>w.id!==id);
    if(WIDGET_TIMERS[id]){
      clearInterval(WIDGET_TIMERS[id]);
      delete WIDGET_TIMERS[id];
    }
    save();
    render();
    toast('Photo widget deleted');
  });
}

/* ===== HOLD / BIND ===== */
function hold(el,tap,long){
  let t,fired=false,skip=false;
  el.addEventListener('pointerdown',e=>{skip=!!e.target.closest('button');fired=false;clearTimeout(t);t=setTimeout(()=>{fired=true;long()},500)});
  el.addEventListener('pointerup',()=>{clearTimeout(t);if(!fired&&!skip)tap()});
  el.addEventListener('pointerleave',()=>clearTimeout(t));
  el.addEventListener('pointercancel',()=>clearTimeout(t));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
function bind(root){
  root.querySelectorAll('[data-item]').forEach(el=>hold(el,()=>openDetail(el.dataset.item),()=>openForm(null,el.dataset.item)));
  root.querySelectorAll('[data-cls]').forEach(el=>hold(el,()=>{S.bubble=S.bubble===el.dataset.cls?null:el.dataset.cls;render()},()=>{S.tab='school';S.cls=el.dataset.cls;S.bubble=null;render()}));
}
document.addEventListener('pointerdown',e=>{if(S.bubble&&!e.target.closest('[data-cls],#bubble')){S.bubble=null;render()}});

function saveForm(){

  const freq=val('repeat');
  if(freq){
    if(freq==='BIWEEKLY_FRIDAY'){
      rrule='FREQ=WEEKLY;INTERVAL=2;BYDAY=FR';

      rrule='FREQ=WEEKLY;INTERVAL=2';

      if(days.length)rrule+=`;BYDAY=${days.join(',')}`;

        if(days.length)rrule+=`;BYDAY=${days.join(',')}`;

function handleImportRec(file){
  if(!file)return;
  const mb=file.size/(1024*1024);
  const cat=$('#ir-cat').value||'school';
  if(mb>10){
    const pv=$('#ir-preview');if(pv)pv.innerHTML=`<p style="color:#c00">File is ${mb.toFixed(1)} MB (over 10 MB). Only filename will be stored.</p><div class="row"><button class="primary" onclick="saveImportedRecFilenameOnly('${esc(file.name)}','${cat}')">Store filename only</button></div>`;
    return;
  }
  const pv=$('#ir-preview');if(pv)pv.innerHTML='<p class="empty">Reading file…</p>';
  const au=document.createElement('audio');
  const objUrl=URL.createObjectURL(file);
  au.src=objUrl;
  au.onloadedmetadata=()=>{
    const dur=Math.round(au.duration)||0;
    URL.revokeObjectURL(objUrl);
    if(mb>5){
      if(pv)pv.innerHTML=`<p style="color:#c00">File is ${mb.toFixed(1)} MB (over 5 MB). Large files may slow the app.</p>`;
    }
    const fr=new FileReader();
    fr.onload=()=>{
      const audioData=fr.result;
      if(pv)pv.innerHTML=`<audio controls src="${audioData}" style="width:100%;margin:8px 0"></audio>
        <p><b>File:</b> ${esc(file.name)} · <b>Duration:</b> ${fmtDur(dur*1000)}</p>

        <div class="row"><button class="primary" onclick="saveImportedRec('${esc(file.name)}',${dur},'${cat}')">Save recording</button></div>`;
      FORM._audioData=audioData;
    };
    fr.readAsDataURL(file);
  };
  au.onerror=()=>toast('Could not read audio file');
}

      </button>

        <button class="big" onclick="triggerBackupShare('${filename}')" style="text-align:center">
          📤 Share / Save to Drive or Files
        </button>
      `:''}

        📋 Copy Backup to Clipboard
      </button>
    </div>

    <label style="margin-top:14px"><b>Raw Backup JSON:</b></label>

      <button onclick="closeSheet()">Close</button>
    </div>
  `);

function triggerBackupDownload(filename){
  const jsonStr=JSON.stringify(D,null,2);
  try{
    const dataUri='data:application/json;charset=utf-8,'+encodeURIComponent(jsonStr);
    const a=document.createElement('a');
    a.href=dataUri;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>a.remove(),200);
    toast('Backup file created');
  }catch(e){
    try{
      const blob=new Blob([jsonStr],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},2000);
      toast('Backup file created');
    }catch(err){
      copyBackupToClipboard();
    }
  }
}

function triggerBackupShare(filename){
  const jsonStr=JSON.stringify(D,null,2);
  try{
    const file=new File([jsonStr],filename,{type:'application/json'});
    navigator.share({
      title:'FlowState Backup',
      text:'FlowState backup data ('+dk(new Date())+')',
      files:[file]
    }).catch(()=>{});
  }catch(e){
    copyBackupToClipboard();
  }
}

function copyBackupToClipboard(){
  const txt=$('#export-json-preview')?$('#export-json-preview').value:JSON.stringify(D,null,2);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>{
      toast('✅ Backup JSON copied to clipboard!');
    }).catch(()=>{
      selectBackupText();
    });
  }else{
    selectBackupText();
  }
}

function selectBackupText(){
  const el=$('#export-json-preview');
  if(el){el.focus();el.select();toast('Text selected. Press Copy.');}
}

function importData(){
  sheet(`
    <h2>📥 Restore Backup</h2>
    <p class="empty">Select a FlowState backup JSON file or paste backup text below.</p>

    <label style="margin-top:10px"><b>Option 1: Choose File</b></label>
    <input type="file" accept=".json,application/json" onchange="handleImportFile(this.files[0])" style="background:#fff">

    <div style="text-align:center;margin:12px 0;opacity:.5">— or —</div>

    <label><b>Option 2: Paste Backup JSON</b></label>
    <textarea id="import-json-text" placeholder="Paste backup JSON text here..." style="min-height:140px;font-family:monospace;font-size:12px"></textarea>
    
    <div class="row">
      <button onclick="pasteClipboardToImport()">📋 Paste from Clipboard</button>
      <button class="primary" onclick="restoreFromInputText()">Verify &amp; Restore</button>
      <button onclick="closeSheet()">Cancel</button>
    </div>
  `);
}

function pasteClipboardToImport(){
  if(navigator.clipboard&&navigator.clipboard.readText){
    navigator.clipboard.readText().then(t=>{
      const el=$('#import-json-text');
      if(el){el.value=t;toast('Pasted from clipboard');}
    }).catch(()=>toast('Hold and tap Paste in the text area'));
  }else{
    toast('Hold and tap Paste in the text area');
  }
}

function restoreFromInputText(){
  const val=($('#import-json-text')?.value||'').trim();
  if(!val)return toast('Please paste backup JSON first');
  try{
    const parsed=JSON.parse(val);
    applyRestoredBackup(parsed);
  }catch(e){
    toast('Invalid JSON format. Please verify the copied text.');
  }
}

function handleImportFile(file){
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const parsed=JSON.parse(fr.result);
      applyRestoredBackup(parsed);
    }catch(e){
      toast('Could not parse JSON file');
    }
  };
  fr.readAsText(file);
}

function applyRestoredBackup(data){
  if(!data||!Array.isArray(data.items)){
    return toast('Not a valid FlowState backup file');
  }
  const count=data.items.length;
  confirmSheet(`Found ${count} items and ${(data.classes||[]).length} classes. Replace current data with this backup?`,()=>{
    D=Object.assign(clone(DEF),data);
    D.settings=Object.assign(clone(DEF.settings),data.settings||{},{bg:Object.assign(clone(DEF.settings.bg),(data.settings||{}).bg||{})});
    D.widgets=data.widgets||[];
    D.bookmarks=data.bookmarks||[];
    D.movies=data.movies||[];
    D.movieFolders=data.movieFolders||[];
    D.habits=data.habits||clone(DEF.habits);
    D.trash=data.trash||[];
    save();
    closeSheet();
    render();
    startWidgetRotations();
    toast(`✅ Backup successfully restored (${count} items)!`);
  });
}

/* ===== CALENDAR / ICS ===== */
function icsFor(id){
  const i=D.items.find(x=>x.id===id);if(!i||!i.due)return;
  const s=new Date(i.due),e=new Date(s.getTime()+36e5),p=n=>String(n).padStart(2,'0');
  const f=d=>d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FlowState//EN','BEGIN:VEVENT','UID:'+i.id+'@flowstate','DTSTART:'+f(s),'DTEND:'+f(e),'SUMMARY:'+i.title,'DESCRIPTION:'+(i.body||'').replace(/\s+/g,' '),'END:VEVENT','END:VCALENDAR'].join('\r\n');

function exportReminders(){

    L.push('BEGIN:VEVENT','UID:'+i.id+'@flowstate','DTSTART:'+f(s),'DTEND:'+f(e),'SUMMARY:'+i.title);

  });

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='flowstate-reminders.ics';document.body.appendChild(a);a.click();a.remove();

function showFocusOverlay(){

function updateFocusDisplay(){
  if(!FOC)return;
  const lbl=$('#focus-label');const tim=$('#focus-time');const sess=$('#focus-sess');const btn=$('#focus-start-btn');
  if(lbl)lbl.textContent=FOC.work?'🎯 Focus Time':'☕ Break Time';

  if(sess)sess.textContent=`Sessions today: ${todaySess} 🔥`;

    D.focusHistory=D.focusHistory||[];
    D.focusHistory.push({date:Date.now(),workMins:FOC.workMins,type:FOC.work?'work':'break'});

    toast(FOC.work?'Break over, back to focus!':'Focus done. Take a break!');

  }

}
function focusToggle(){

}
function focusSwap(){
  if(FOC.iv){clearInterval(FOC.iv);FOC.iv=null}

/* ===== CANVAS ANIMATION ===== */
const cv=$('#blobs'),cx=cv.getContext('2d');
const BL=[[0,0,230,'#ff8fa3'],[1,0,200,'#9db4f0'],[0,1,240,'#8fd3a8'],[1,1,260,'#c39bf0'],[.5,1,160,'#f7c77a'],[.5,0,150,'#7fd6e8']];
let W=0,H=0,T=0;
let PARTS=[];
const ANIMS={bubbles:'Lava bubbles',waves:'Soft waves',stars:'Floating dots',off:'Off'};
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;seedParts()}
function seedParts(){PARTS=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),r:2+Math.random()*4,v:.2+Math.random()*.8,c:PAL[Math.floor(Math.random()*PAL.length)]}))}
function drawBubbles(){
  BL.forEach(([fx,fy,r,c],k)=>{
    const x=fx*W+Math.sin(T*.004+k*2)*70,y=fy*H+Math.cos(T*.005+k)*55;
    const g=cx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,c+'aa');g.addColorStop(1,c+'00');
    cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);cx.fill();
  });
}
function drawWaves(){
  for(let k=0;k<3;k++){
    cx.beginPath();cx.moveTo(0,H);
    for(let x=0;x<=W;x+=20){cx.lineTo(x,H*(.78+k*.07)+Math.sin(x*.008+T*.02+k*1.5)*35)}
    cx.lineTo(W,H);cx.closePath();
    cx.fillStyle=PAL[(k+2)%PAL.length]+'66';cx.fill();
  }
}
function drawDots(sp){
  PARTS.forEach(p=>{
    p.y-=p.v*.0015*sp;if(p.y<0){p.y=1;p.x=Math.random()}
    cx.fillStyle=p.c+'cc';cx.beginPath();cx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);cx.fill();
  });
}
function frame(){
  const sp=D.settings.reduce?0:D.settings.speed;T+=sp;
  cx.clearRect(0,0,W,H);
  const a=D.settings.anim||'bubbles';
  if(a==='bubbles')drawBubbles();
  else if(a==='waves')drawWaves();
  else if(a==='stars')drawDots(sp);
  requestAnimationFrame(frame);
}

function restoreFromTrash(id){
  const idx=(D.trash||[]).findIndex(x=>x.id===id);

  const [it]=D.trash.splice(idx,1);
  delete it.deletedAt;
  D.items.push(it);
  save();sendGoogleSync('upsert',it);openTrashBin();render();
  toast('Restored "'+it.title+'"');
}

function permanentlyDeleteTrash(id){
  D.trash=(D.trash||[]).filter(x=>x.id!==id);

}

function toggleNoteCheckbox(checkboxIndex){
  const el=$('#note-ov-body');
  if(!el)return;
  const lines=el.value.split('\n');
  let cbCount=0;
  for(let i=0;i<lines.length;i++){
    if(lines[i].match(/^\s*-\s*\[([ xX])\]/)){
      if(cbCount===checkboxIndex){
        if(lines[i].includes('[ ]')) lines[i]=lines[i].replace('[ ]','[x]');
        else lines[i]=lines[i].replace(/\[[xX]\]/,'[ ]');
        break;
      }
      cbCount++;
    }
  }
  el.value=lines.join('\n');
  noteAutoSave();
}

const MovieDB=(()=>{
  let dbProm=null;
  function open(){
    if(dbProm)return dbProm;
    dbProm=new Promise((resolve,reject)=>{
      if(!('indexedDB' in window))return reject(new Error('IndexedDB unsupported'));
      const req=indexedDB.open('FlowStateMoviesDB',1);
      req.onupgradeneeded=()=>{
        const db=req.result;
        if(!db.objectStoreNames.contains('videos'))db.createObjectStore('videos');
      };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error('DB open failed'));
    });
    return dbProm;
  }
  async function put(id,blob){
    try{
      const db=await open();
      return await new Promise((resolve,reject)=>{
        const tx=db.transaction('videos','readwrite');
        tx.objectStore('videos').put(blob,id);
        tx.oncomplete=()=>resolve({ok:true});
        tx.onerror=()=>reject(tx.error);
        tx.onabort=()=>reject(tx.error||new Error('Transaction aborted'));
      });
    }catch(e){return {ok:false,error:e};}
  }
  async function get(id){
    try{
      const db=await open();
      return await new Promise((resolve)=>{
        const tx=db.transaction('videos','readonly');
        const req=tx.objectStore('videos').get(id);
        req.onsuccess=()=>resolve(req.result||null);
        req.onerror=()=>resolve(null);
      });
    }catch(e){return null;}
  }
  async function delMany(ids){
    if(!ids||!ids.length)return;
    try{
      const db=await open();
      await new Promise((resolve)=>{
        const tx=db.transaction('videos','readwrite');
        const st=tx.objectStore('videos');
        ids.forEach(id=>st.delete(id));
        tx.oncomplete=()=>resolve();
        tx.onerror=()=>resolve();
      });
    }catch(e){}
  }
  return {put,get,del:(id)=>delMany([id]),delMany};
})();

function mhFmtSec(sec){
  sec=Math.max(0,Math.floor(sec||0));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(h>0)return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return m+':'+String(s).padStart(2,'0');
}

function mhRemainingText(mv){
  const dur=mv.duration||0,cur=mv.currentTime||0;
  if(!dur)return cur>5?mhFmtSec(cur)+' watched':'Not started';
  const rem=Math.max(0,dur-cur);
  if(cur>=10&&rem<=8)return '✓ Finished';
  if(cur<3)return mhFmtSec(dur)+' total';
  return mhFmtSec(rem)+' left';
}

function mhPct(mv){
  if(!mv.duration||mv.duration<=0)return 0;
  return Math.max(0,Math.min(100,Math.round(((mv.currentTime||0)/mv.duration)*100)));
}

function mhFolderName(fid){
  if(!fid)return '';
  const f=(D.movieFolders||[]).find(x=>x.id===fid);
  return f?((f.icon||'📁')+' '+f.name):'';
}

function mhFilteredMovies(){
  const all=(D.movies||[]).slice().sort((a,b)=>(b.lastWatched||b.addedAt||0)-(a.lastWatched||a.addedAt||0));
  const q=(MH.query||'').trim().toLowerCase();
  return all.filter(mv=>{
    if(MH.folder==='uncategorized'&&mv.folderId)return false;
    if(MH.folder!=='all'&&MH.folder!=='uncategorized'&&mv.folderId!==MH.folder)return false;
    if(!q)return true;
    const fName=mhFolderName(mv.folderId).toLowerCase();
    return ((mv.title||'')+' '+(mv.description||'')+' '+fName).toLowerCase().includes(q);
  });
}

function mhCardHtml(mv){
  const isSel=MH.selected.has(mv.id);

  const rem=mhRemainingText(mv);
  const fLabel=mhFolderName(mv.folderId);
  const ext=(mv.fileName||'').split('.').pop().toUpperCase().slice(0,4)||'VIDEO';
  return `<div class="mh-card${isSel?' selected':''}" onclick="mhOnCardClick('${mv.id}')">
    <div class="mh-poster">
      ${mv.poster
        ?`<img src="${mv.poster}" alt="${esc(mv.title)}">`

      ${fLabel?`<span class="mh-card-folder">${esc(fLabel)}</span>`:''}

      ${(mv.duration>0||(mv.currentTime||0)>5)?`<span class="mh-card-rem">${esc(rem)}</span>`:''}
      ${pct>0?`<div class="mh-prog-track"><div class="mh-prog-fill" style="width:${pct}%"></div></div>`:''}

function mhCompressImage(file,maxDim=520){
  return new Promise((resolve)=>{
    if(!file)return resolve(null);
    const fr=new FileReader();
    fr.onerror=()=>resolve(null);
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>resolve(null);
      im.onload=()=>{
        const sc=Math.min(1,maxDim/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',0.82));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function mhProbeVideo(file){
  return new Promise((resolve)=>{
    const url=URL.createObjectURL(file);
    const v=document.createElement('video');
    v.preload='metadata';
    v.muted=true;
    let done=false;
    const finish=(dur,thumb)=>{
      if(done)return;done=true;
      URL.revokeObjectURL(url);
      resolve({duration:dur||0,thumb:thumb||null});
    };
    const timer=setTimeout(()=>finish(v.duration||0,null),3200);
    v.onerror=()=>{clearTimeout(timer);finish(0,null);};
    v.onloadedmetadata=()=>{
      const dur=isFinite(v.duration)?v.duration:0;
      const target=dur>4?Math.min(6,dur*0.12):0.5;
      try{v.currentTime=target;}catch(e){clearTimeout(timer);finish(dur,null);}
    };
    v.onseeked=()=>{
      clearTimeout(timer);
      let thumb=null;
      try{
        if(v.videoWidth>0&&v.videoHeight>0){
          const sc=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight));
          const c=document.createElement('canvas');
          c.width=Math.max(1,Math.round(v.videoWidth*sc));
          c.height=Math.max(1,Math.round(v.videoHeight*sc));
          c.getContext('2d').drawImage(v,0,0,c.width,c.height);
          thumb=c.toDataURL('image/jpeg',0.8);
        }
      }catch(e){thumb=null;}
      finish(isFinite(v.duration)?v.duration:0,thumb);
    };
    v.src=url;
  });
}

          <div style="width:28px;height:28px;border-radius:50%;background:${f.color||'var(--cal)'};display:flex;align-items:center;justify-content:center">${esc(f.icon||'📁')}</div>
          <div class="grow"><b>${esc(f.name)}</b><small style="display:block;opacity:.65">${cnt} movie${cnt===1?'':'s'}</small></div>
          <button onclick="openAddFolderModal('${f.id}')">Edit</button>
          <button class="danger" onclick="deleteMovieFolder('${f.id}')">Delete</button>
        </div>`;
      }).join(''):'<p class="empty">No folders created yet.</p>'}
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" onclick="openAddFolderModal()">+ New Folder</button>
      <button onclick="closeSheet()">Close</button>
    </div>`);
}

function deleteMovieFolder(id){
  const f=(D.movieFolders||[]).find(x=>x.id===id);if(!f)return;
  confirmSheet(`Delete folder "${f.name}"? Movies inside will stay in All / Uncategorized.`,()=>{
    D.movieFolders=(D.movieFolders||[]).filter(x=>x.id!==id);
    (D.movies||[]).forEach(m=>{if(m.folderId===id)m.folderId='';});
    if(MH.folder===id)MH.folder='all';
    save();render();openManageFoldersModal();
  });
}

function openMovieDetail(id){
  const mv=(D.movies||[]).find(m=>m.id===id);if(!mv)return;
  const pct=mhPct(mv);
  const rem=mhRemainingText(mv);
  const hasStarted=(mv.currentTime||0)>=3;
  const fOpts=[`<option value="">Uncategorized</option>`,...(D.movieFolders||[]).map(f=>`<option value="${f.id}" ${mv.folderId===f.id?'selected':''}>${esc(f.icon||'📁')} ${esc(f.name)}</option>`)].join('');

  sheet(`
    <div class="mh-detail-hero">
      <div class="mh-detail-poster">
        ${mv.poster?`<img src="${mv.poster}" alt="${esc(mv.title)}">`:`🎬`}
      </div>
      <div class="grow" style="min-width:190px">
        <small style="opacity:.65">${esc(mhFolderName(mv.folderId)||'Uncategorized')}${mv.fileSize?' · '+(mv.fileSize/(1024*1024)).toFixed(0)+' MB':''}</small>
        <h2 style="margin:4px 0 8px">${esc(mv.title)}</h2>
        <div class="row" style="margin-top:6px">
          <button class="primary" onclick="mhPlayMovie('${mv.id}','mini')">▶ ${hasStarted?'Resume':'Play'}</button>
          <button onclick="mhPlayMovie('${mv.id}','fullscreen')">⛶ Fullscreen</button>
          ${hasStarted?`<button onclick="mhPlayMovie('${mv.id}','mini',true)">⏮ Start Over</button>`:''}
        </div>
      </div>
    </div>

    <div class="mh-detail-prog">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:.9em">
        <b>Progress: ${pct}%</b>
        <span>${esc(rem)}${mv.duration?' ('+mhFmtSec(mv.currentTime||0)+' / '+mhFmtSec(mv.duration)+')':''}</span>
      </div>
      <div class="mh-detail-bar"><div style="width:${pct}%"></div></div>
      ${hasStarted?`<button style="padding:4px 10px;font-size:12px" onclick="mhResetProgress('${mv.id}')">Reset Watch Progress</button>`:''}
    </div>

    <div class="panel" style="margin-top:10px">
      <h3 style="margin-bottom:6px">🎨 Movie Icon / Poster Design</h3>
      <div class="row" style="margin-top:4px">
        <label style="margin:0"><span class="chip" style="display:inline-block;border:2px solid var(--cal);border-radius:12px;padding:6px 12px;cursor:pointer">🖼️ Upload New Photo<input type="file" accept="image/*" style="display:none" onchange="mhChangeMoviePoster('${mv.id}',this.files[0])"></span></label>
        ${mv.poster?`<button onclick="mhRemoveMoviePoster('${mv.id}')">Reset Icon</button>`:''}
      </div>
    </div>

    <label><b>Title</b>
      <input id="mhd-title" value="${esc(mv.title)}">
    </label>
    <label><b>Folder / Category</b>
      <select id="mhd-folder">${fOpts}</select>
    </label>
    <label><b>Description / Notes</b>
      <textarea id="mhd-desc" style="min-height:95px" placeholder="Add a description, notes, or timestamps...">${esc(mv.description||'')}</textarea>
    </label>

    <div class="row">
      <button class="primary" onclick="mhSaveMovieEdits('${mv.id}')">Save Details</button>
      <label style="margin:0"><span style="display:inline-block;border:2px solid var(--cal);border-radius:12px;padding:8px 12px;cursor:pointer;background:#fff;color:var(--text)">🔗 Re-link Video File<input type="file" accept="video/*,.mp4,.mkv,.webm,.mov,.m4v" style="display:none" onchange="mhRelinkVideo('${mv.id}',this.files[0])"></span></label>
      <button class="danger" onclick="mhConfirmDeleteOne('${mv.id}')">🗑️ Remove Movie</button>
      <button onclick="closeSheet()">Close</button>
    </div>
  `);
}

function mhSaveMovieEdits(id){
  const mv=(D.movies||[]).find(m=>m.id===id);if(!mv)return;
  mv.title=($('#mhd-title')?.value||'').trim()||mv.title;
  mv.folderId=$('#mhd-folder')?.value||'';
  mv.description=$('#mhd-desc')?.value||'';
  save();
  if(MH.player.movieId===id){
    $('#mh-player-title').textContent='🎬 '+mv.title;
    $('#mh-fs-title').textContent=mv.title;
  }
  render();
  openMovieDetail(id);
  toast('Movie details saved');
}

async function mhChangeMoviePoster(id,file){
  if(!file)return;
  const img=await mhCompressImage(file,520);
  if(!img)return toast('That image could not be opened. Try a JPG or PNG.');
  const mv=(D.movies||[]).find(m=>m.id===id);if(!mv)return;
  mv.poster=img;
  save();render();openMovieDetail(id);
  toast('Movie icon updated!');
}

function mhRemoveMoviePoster(id){
  const mv=(D.movies||[]).find(m=>m.id===id);if(!mv)return;
  mv.poster=null;
  save();render();openMovieDetail(id);
  toast('Poster removed');
}

function mhResetProgress(id){
  const mv=(D.movies||[]).find(m=>m.id===id);if(!mv)return;
  mv.currentTime=0;
  save();
  if(MH.player.movieId===id){const v=$('#mh-video');if(v)v.currentTime=0;}
  render();openMovieDetail(id);
  toast('Progress reset to start');
}

async function mhRelinkVideo(id,file){
  if(!file)return;
  const mv=(D.movies||[]).find(m=>m.id===id);if(!mv)return;
  if(MOVIE_SESSION_URLS[id])URL.revokeObjectURL(MOVIE_SESSION_URLS[id]);
  MOVIE_SESSION_URLS[id]=URL.createObjectURL(file);
  const res=await MovieDB.put(id,file);
  mv.fileName=file.name;mv.fileSize=file.size;mv.fileType=file.type||'video/mp4';mv.hasBlob=res.ok;
  save();render();openMovieDetail(id);
  toast('Video file linked!');
}

async function mhPlayMovie(id,mode='mini',fromStart=false){
  const mv=(D.movies||[]).find(m=>m.id===id);if(!mv)return;
  let url=MOVIE_SESSION_URLS[id];
  if(!url){
    const blob=await MovieDB.get(id);
    if(blob){
      url=URL.createObjectURL(blob);
      MOVIE_SESSION_URLS[id]=url;
    }
  }
  if(!url){
    toast('Video file not found offline. Tap "Re-link Video File" to open it.');
    openMovieDetail(id);
    return;
  }

  closeSheet();
  const vid=$('#mh-video');
  const shell=$('#movie-player-shell');
  const isNewMovie=MH.player.movieId!==id||vid.src!==url;

  MH.player.movieId=id;
  mv.lastWatched=Date.now();
  if(fromStart)mv.currentTime=0;
  save();

  $('#mh-player-title').textContent='🎬 '+mv.title;
  $('#mh-fs-title').textContent=mv.title;
  mhSetPlayerMode(mode);

  if(isNewMovie){
    vid.src=url;
    const seekTarget=(!fromStart&&mv.currentTime>1&&(!mv.duration||mv.currentTime<mv.duration-5))?mv.currentTime:0;
    const onMeta=()=>{
      if(isFinite(vid.duration)&&vid.duration>0){
        mv.duration=vid.duration;save();
      }
      if(seekTarget>0)vid.currentTime=seekTarget;
      vid.play().catch(()=>{});
    };
    if(vid.readyState>=1)onMeta();
    else vid.addEventListener('loadedmetadata',onMeta,{once:true});
  }else{
    if(fromStart)vid.currentTime=0;
    vid.play().catch(()=>{});
  }
  mhUpdateControlsUI();
}

function mhSetPlayerMode(mode){
  MH.player.mode=mode;
  const shell=$('#movie-player-shell');
  shell.classList.remove('closed','mini','large','fullscreen');
  shell.classList.add(mode);
  if(mode==='mini'||mode==='large'){
    const btn=$('#mh-btn-size');
    if(btn)btn.textContent=mode==='mini'?'⤢':'🗗';
  }
  if(mode!=='mini'){
    shell.style.left='';shell.style.top='';shell.style.right='';shell.style.bottom='';
  }
}

function mhCycleSize(){
  if(MH.player.mode==='mini')mhSetPlayerMode('large');
  else if(MH.player.mode==='large')mhSetPlayerMode('mini');
  else mhSetPlayerMode('mini');
}
function mhToggleFullscreen(){
  if(MH.player.mode==='fullscreen')mhShrinkToMini();
  else mhSetPlayerMode('fullscreen');
}
function mhShrinkToMini(){
  if(document.fullscreenElement){try{document.exitFullscreen();}catch(e){}}
  mhSetPlayerMode('mini');
}
function mhClosePlayer(silent=false){
  const vid=$('#mh-video');
  if(!silent)mhPersistCurrentProgress(true);
  if(vid){vid.pause();vid.removeAttribute('src');vid.load();}
  MH.player.movieId=null;
  mhSetPlayerMode('closed');
  if(S.tab==='moviehub'&&!silent)mhRefreshGridOnly();
}

function mhTogglePlay(){
  const vid=$('#mh-video');if(!vid)return;
  if(vid.paused)vid.play().catch(()=>{});
  else vid.pause();
}
function mhOnVideoTap(e){
  if(e.target.closest('button'))return;
  mhTogglePlay();
}
function mhSeekBy(delta){
  const vid=$('#mh-video');if(!vid||!isFinite(vid.duration))return;
  vid.currentTime=Math.max(0,Math.min(vid.duration,vid.currentTime+delta));
  mhPersistCurrentProgress(true);
  mhUpdateControlsUI();
}
function mhOnSeekInput(val){
  MH.player.seeking=true;
  const vid=$('#mh-video');if(!vid||!isFinite(vid.duration))return;
  const t=(val/1000)*vid.duration;
  const lbl=$('#mh-time-lbl');
  if(lbl)lbl.textContent=mhFmtSec(t)+' / '+mhFmtSec(vid.duration);
}
function mhOnSeekCommit(val){
  const vid=$('#mh-video');
  MH.player.seeking=false;
  if(!vid||!isFinite(vid.duration))return;
  vid.currentTime=(val/1000)*vid.duration;
  mhPersistCurrentProgress(true);
}
function mhToggleMute(){
  const vid=$('#mh-video');if(!vid)return;
  vid.muted=!vid.muted;
  mhUpdateControlsUI();
}
function mhUpdateControlsUI(){
  const vid=$('#mh-video');if(!vid)return;
  const pBtn=$('#mh-play-btn'),mBtn=$('#mh-mute-btn'),seek=$('#mh-seek'),lbl=$('#mh-time-lbl');
  if(pBtn)pBtn.textContent=vid.paused?'▶':'⏸';
  if(mBtn)mBtn.textContent=vid.muted?'🔇':'🔊';
  const dur=isFinite(vid.duration)?vid.duration:0;
  const cur=vid.currentTime||0;
  if(seek&&!MH.player.seeking)seek.value=dur>0?Math.round((cur/dur)*1000):0;
  if(lbl)lbl.textContent=mhFmtSec(cur)+' / '+mhFmtSec(dur);
}

function mhPersistCurrentProgress(force=false){
  const id=MH.player.movieId;if(!id)return;
  const vid=$('#mh-video');if(!vid)return;
  const now=Date.now();
  if(!force&&now-MH.player.lastSaveTs<4000)return;
  const mv=(D.movies||[]).find(m=>m.id===id);if(!mv)return;
  if(isFinite(vid.duration)&&vid.duration>0)mv.duration=vid.duration;
  mv.currentTime=vid.currentTime||0;
  mv.lastWatched=now;
  MH.player.lastSaveTs=now;
  save();
  if(S.tab==='moviehub'&&!MH.selectMode&&force)mhRefreshGridOnly();
}

(function initMoviePlayer(){
  const vid=$('#mh-video'),bar=$('#mh-drag-bar'),shell=$('#movie-player-shell');
  if(vid){
    vid.addEventListener('timeupdate',()=>{mhUpdateControlsUI();mhPersistCurrentProgress(false);});
    vid.addEventListener('play',mhUpdateControlsUI);
    vid.addEventListener('pause',()=>{mhUpdateControlsUI();mhPersistCurrentProgress(true);});
    vid.addEventListener('seeked',()=>{mhUpdateControlsUI();mhPersistCurrentProgress(true);});
    vid.addEventListener('ended',()=>{mhPersistCurrentProgress(true);mhUpdateControlsUI();});
  }
  if(bar&&shell){
    let dragging=false,sx=0,sy=0,sl=0,st=0;
    bar.addEventListener('pointerdown',e=>{
      if(e.target.closest('button')||MH.player.mode==='fullscreen')return;
      dragging=true;
      const r=shell.getBoundingClientRect();
      sx=e.clientX;sy=e.clientY;sl=r.left;st=r.top;
      shell.style.transform='none';
      shell.style.right='auto';shell.style.bottom='auto';
      shell.style.left=sl+'px';shell.style.top=st+'px';
      bar.setPointerCapture(e.pointerId);
    });
    bar.addEventListener('pointermove',e=>{
      if(!dragging)return;
      const nx=Math.max(6,Math.min(innerWidth-shell.offsetWidth-6,sl+(e.clientX-sx)));
      const ny=Math.max(6,Math.min(innerHeight-shell.offsetHeight-6,st+(e.clientY-sy)));
      shell.style.left=nx+'px';shell.style.top=ny+'px';
    });
    bar.addEventListener('pointerup',()=>{dragging=false;});
    bar.addEventListener('pointercancel',()=>{dragging=false;});
  }
})();

window.addEventListener('resize',resize);
resize();rail_init();clock();render();tick();flushGoogleSync();
setInterval(tick,15000);setInterval(clock,1000);
requestAnimationFrame(frame);
</script>

  navigator.serviceWorker.register('sw.js').catch(() => {});
}
