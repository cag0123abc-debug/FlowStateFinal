<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FlowState</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#3d5ba9">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#3d5ba9">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&family=Lexend:wght@400;600&family=Caveat:wght@500;700&family=Nunito:wght@400;800&display=swap" rel="stylesheet">
<script src="recurrence.js"></script>
<style>
:root{--text:#1d2440;--cal:#3d5ba9;--font:system-ui,sans-serif;--fs:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);font-size:var(--fs);color:var(--text);background:#f5e6e1;transition:background .4s}
#blobs{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;display:flex;height:100%}
#rail{width:112px;flex:none;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0;background:rgba(70,60,75,.35);border-radius:0 46px 46px 0;overflow:hidden}
#rail button{width:84px;height:84px;flex:none;border-radius:50%;border:4px solid #3a3440;font-size:34px;background:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .25s;padding:0}
#rail button.active{transform:scale(1.12);border-color:#000;box-shadow:0 0 0 4px #ffd45c}
#rail.collapsed{justify-content:flex-start}
#rail.collapsed button:not(.active){display:none}
#rail.drop button{animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px}
.logo{font-weight:900;font-size:30px;letter-spacing:1px;background:linear-gradient(90deg,#ff7a59,#c44cc9,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
.tr{display:flex;align-items:center;gap:12px}
#clock{background:#111;color:#fff;font-family:monospace;font-size:20px;padding:4px 10px;border-radius:6px}
header button{background:none;border:0;font-size:26px;position:relative;cursor:pointer;padding:4px}
#badge{position:absolute;top:-4px;right:-6px;background:#e33;color:#fff;border-radius:10px;font-size:12px;padding:0 5px;font-style:normal}
#badge:empty{display:none}
#main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
#view{flex:1;overflow:auto;padding:6px 18px 120px}
h1{margin:6px 0 12px;font-size:1.9em}
h2{margin:0 0 10px}
h3{margin:0 0 8px}
.panel{background:rgba(255,255,255,.85);border:3px solid var(--cal);border-radius:18px;padding:14px;margin-bottom:14px;overflow:auto}
.panel.tall{min-height:420px}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 5px rgba(0,0,0,.12);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card small{display:block;opacity:.7}
.card.done{opacity:.5;text-decoration:line-through}
.chk{width:34px;height:34px;flex:none;border-radius:8px;padding:0}
.grow{flex:1;min-width:0}
.empty{opacity:.6;font-style:italic}
.body{white-space:pre-wrap;max-height:260px;overflow:auto;background:#faf7f7;border-radius:10px;padding:8px;margin-top:6px}
button{font:inherit;border-radius:12px;border:2px solid var(--cal);background:#fff;padding:8px 14px;color:var(--text);cursor:pointer}
button.primary{background:var(--cal);color:#fff}
button.danger{color:#c00;border-color:#c00}
button.big{display:block;width:100%;margin:8px 0;font-size:1.1em;padding:14px;text-align:left}
button.chip{border-radius:20px;padding:6px 12px}
button.chip.on{background:var(--cal);color:#fff}
.sw{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid #fff}
.sw.on{outline:3px solid #000}
input,textarea,select{font:inherit;width:100%;padding:10px;border-radius:10px;border:2px solid #bbb;margin:6px 0;background:#fff;color:#222}
input[type=range],input[type=color],input[type=checkbox]{width:auto}
input[type=color]{height:40px;padding:2px}
textarea{min-height:170px}
label{display:block;margin:6px 0}
label.chip{display:inline-flex;align-items:center;gap:4px;width:auto;padding:6px 10px;border:2px solid var(--cal);border-radius:20px;margin:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
#fab{position:absolute;right:22px;bottom:18px;width:74px;height:74px;border-radius:50%;background:#111;color:#fff;font-size:44px;border:4px solid #2fd46b;padding:0;line-height:1}
#schoolBtn{position:absolute;right:112px;bottom:26px;width:62px;height:62px;border-radius:50%;background:#f7d28a;padding:0;font-size:30px;display:none}
#schoolBtn.on{display:block}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20}
#sheet.on{display:flex}
.box{background:#fbf7f6;color:var(--text);border-radius:20px;padding:20px;width:min(640px,92vw);max-height:88vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:14px;display:none;z-index:30;gap:12px;align-items:center}
#toast.on{display:flex}
#toast button{background:#fff;color:#222;border:0;padding:6px 12px}
#bubble{position:fixed;display:none;z-index:15;background:#fff;border:3px solid var(--cal);border-radius:18px;padding:12px 14px;width:260px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
#bubble p{margin:4px 0}
#bubble button{margin:4px 4px 0 0;padding:6px 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:20px 10px}
.blob{position:relative;aspect-ratio:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid rgba(0,0,0,.55);border-radius:58% 42% 55% 45%/46% 56% 44% 54%;transition:transform .4s,opacity .4s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.blob.pushed{transform:translateX(70px);opacity:.55}
.blob .ico{font-size:46px}
.blob b{font-size:1.2em}
.home{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;align-items:start}
.sticky-col{display:flex;flex-direction:column;gap:14px}
.sticky{background:#fff6a8;padding:12px;box-shadow:0 4px 8px rgba(0,0,0,.2);border-radius:6px}
.sticky:nth-child(2){transform:rotate(1deg)}
.sticky:nth-child(3){transform:rotate(-1deg)}
.cal{background:rgba(255,255,255,.92);border:4px solid var(--cal);border-radius:24px;padding:14px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead b{font-size:1.4em}
.calhead button{padding:4px 14px;font-size:1.3em}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk span{font-weight:700;opacity:.7}
.day{position:relative;padding:10px 0;border-radius:10px;background:#f4eeee;border:0;font-size:1.05em}
.day.today{outline:3px solid var(--cal)}
.day.sel{background:var(--cal);color:#fff}
.day i{position:absolute;bottom:2px;right:4px;font-size:10px;font-style:normal;background:#e33;color:#fff;border-radius:8px;padding:0 4px}
.dl{margin:12px 0 4px}
.dayList{max-height:240px;overflow:auto}
.wkgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wkcol{text-align:left;min-height:150px;background:#f4eeee;border:0;padding:6px;font-size:.9em;overflow:hidden}
.wkcol.sel{outline:3px solid var(--cal)}
.wkit{font-size:.85em;background:#fff;border-radius:6px;padding:2px 4px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#view.enter{animation:viewIn .35s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.box{animation:pop .22s ease-out}
.blob .ico{
  display:flex;justify-content:center;align-items:center;
  width:76%;height:76%;min-width:0;min-height:0;
  overflow:hidden;border-radius:50%;font-size:46px;
}
.blob .ico img{
  display:block;width:100%;height:100%;max-width:100%;max-height:100%;
  aspect-ratio:1;object-fit:cover;object-position:center;
  border-radius:50%;flex:none;
}
#rail img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:50%}
/* ===== FlowState 2.0 : expandable text ===== */
.body{max-height:none!important;overflow:visible!important}
.dayList{max-height:none!important;overflow:visible!important}
.panel.tall{min-height:auto!important}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.clamp.open{display:block;-webkit-line-clamp:unset;overflow:visible}
.expbtn{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line,rgba(20,20,40,.12));background:rgba(255,255,255,.7);font:600 12px/1 Nunito,system-ui,sans-serif;color:inherit;cursor:pointer}
.expbtn:hover{background:#fff}

/* ===== tooltips ===== */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:#1e2438;color:#fff;font:600 12px/1.35 Nunito,system-ui,sans-serif;padding:6px 9px;border-radius:8px;white-space:nowrap;max-width:240px;z-index:90;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none}

/* ===== recurring badges + chips ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font:700 11px/1.5 Nunito,system-ui,sans-serif;background:rgba(61,91,169,.12);color:#2b3d75}
.badge.src{background:rgba(15,140,110,.14);color:#0b5f4b}
.badge.skip{background:rgba(180,60,60,.14);color:#8d2b2b}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.wchip{padding:6px 10px;border-radius:999px;border:1px solid var(--line,rgba(20,20,40,.14));background:#fff;font:700 12px/1 Nunito,system-ui,sans-serif;cursor:pointer}
.wchip.on{background:#3d5ba9;border-color:#3d5ba9;color:#fff}
.repeatbox{border:1px dashed rgba(61,91,169,.35);border-radius:14px;padding:10px;margin:8px 0;background:rgba(61,91,169,.04)}
.repeatbox h4{margin:0 0 6px;font:700 13px/1.2 Nunito,system-ui,sans-serif;opacity:.75}
.occ{border-left:3px solid rgba(61,91,169,.35)}

/* ===== class books ===== */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.book{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 10px 24px rgba(24,32,64,.16);cursor:pointer;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .16s ease,box-shadow .16s ease}
.book:active{transform:scale(.985)}
.book .cover{position:absolute;inset:0;background-size:cover;background-position:center}
.book .spine{position:absolute;left:0;top:0;bottom:0;width:14px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.06));box-shadow:inset -2px 0 4px rgba(0,0,0,.18)}
.book .bmeta{position:relative;padding:12px;background:linear-gradient(180deg,transparent,rgba(8,10,22,.72) 62%);color:#fff}
.book .bmeta .bt{font:700 17px/1.2 Fredoka,Nunito,sans-serif;text-shadow:0 1px 6px rgba(0,0,0,.5);word-break:break-word}
.book .bmeta .bs{font:600 12px/1.4 Nunito,system-ui,sans-serif;opacity:.9}
.book .stick{position:absolute;font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));pointer-events:none}
.book .st1{top:8px;right:10px}.book .st2{top:8px;left:22px}.book .st3{bottom:52px;right:12px}
.book .reorder{position:absolute;top:6px;left:18px;display:flex;gap:4px;z-index:3}
.book .reorder button{width:26px;height:26px;border-radius:8px;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:14px;line-height:1;cursor:pointer}
.book .pin{position:absolute;top:8px;right:8px;z-index:3}
.book.flat .cover{display:none}
.coverpick{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.coverpick .sw{width:44px;height:44px;border-radius:12px;border:2px solid transparent;cursor:pointer}
.coverpick .sw.on{border-color:#1e2438;box-shadow:0 0 0 3px rgba(61,91,169,.25)}

/* ===== dashboard ===== */
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.dsec{grid-column:span 12;border-radius:16px;background:rgba(255,255,255,.72);border:1px solid var(--line,rgba(20,20,40,.08));padding:12px;backdrop-filter:blur(6px)}
.dsec.sz-s{grid-column:span 12}
.dsec.sz-m{grid-column:span 12}
.dsec.sz-l{grid-column:span 12}
@media(min-width:820px){.dsec.sz-s{grid-column:span 4}.dsec.sz-m{grid-column:span 6}.dsec.sz-l{grid-column:span 12}}
.dsec.hidden{display:none}
.dsec h3{margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dsec .tools{display:flex;gap:4px}
.dsec .tools button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line,rgba(20,20,40,.12));background:#fff;cursor:pointer;font-size:13px;line-height:1}

/* ===== decorative widget ===== */
.widget{position:relative;border-radius:18px;overflow:hidden;min-height:170px;display:flex;align-items:flex-end;box-shadow:0 12px 26px rgba(24,32,64,.18)}
.widget .wimg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .4s ease}
.widget .wq{position:relative;padding:16px;color:#fff;font:600 16px/1.4 Caveat,Nunito,cursive;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.widget .wbar{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2}
.widget .wbar button{border:0;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font:600 12px/1 Nunito,sans-serif;padding:7px 10px;cursor:pointer}
.widget.sz-s{min-height:120px}.widget.sz-m{min-height:170px}.widget.sz-l{min-height:260px}

/* ===== recordings ===== */
.rec{border-radius:16px;background:rgba(255,255,255,.8);border:1px solid var(--line,rgba(20,20,40,.08));padding:12px;margin-bottom:10px}
.rec audio{width:100%;margin-top:8px}
.rec .meta{font:600 12px/1.4 Nunito,system-ui,sans-serif;opacity:.7;display:flex;gap:8px;flex-wrap:wrap}
.tr{white-space:pre-wrap;font:400 14px/1.55 Nunito,system-ui,sans-serif}

/* ===== browser ===== */
.bmk{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.8);border:1px solid var(--line,rgba(20,20,40,.08));margin-bottom:8px}
.bmk .fav{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(61,91,169,.12);font-size:17px}
.bmk .bu{font:600 12px/1.3 Nunito,system-ui,sans-serif;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== focus mode + transitions ===== */
body.focus .rail,body.focus .fab,body.focus #bgc,body.focus .hint{display:none!important}
body.focus main{padding-bottom:24px}
.fadeIn{animation:fsFade .2s ease both}
@keyframes fsFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fadeIn{animation:none}}

/* ===== misc ===== */
.hint{font:600 12px/1.4 Nunito,system-ui,sans-serif;opacity:.62;margin:6px 0}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.lib .li{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;background:#eef}
.lib .li img{width:100%;height:100%;object-fit:cover;display:block}
.lib .li button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:999px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:1;cursor:pointer}
.row.wrap{flex-wrap:wrap}
/* ==== FlowState 2.0 layout additions ==== */
#fs-tools{display:inline-flex;gap:2px;align-items:center;margin-left:2px}
#fs-tools button{border:0;background:transparent;border-radius:10px;padding:6px 8px;font-size:16px;line-height:1;cursor:pointer}
#fs-tools button:hover{background:rgba(0,0,0,.06)}
#fs-tools .dot{color:#3d5ba9;font-size:14px;margin-left:2px}
body.focus .rail,body.focus #badge,body.focus #fab{display:none!important}
body.focus #view{max-width:900px;margin:0 auto}
.fadeIn{animation:fsIn .22s ease}
@keyframes fsIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.dash-sec{position:relative;grid-column:span 1}
.dash-sec.l{grid-column:1/-1}
.dash-sec.s{max-width:340px}
.dash-tools{display:flex;gap:4px;justify-content:flex-end;opacity:.35;transition:opacity .2s}
.dash-sec:hover .dash-tools{opacity:1}
.dash-tools button{border:0;background:rgba(255,255,255,.7);border-radius:8px;padding:2px 7px;font-size:12px;cursor:pointer}
.widget{position:relative;border-radius:20px;min-height:170px;display:flex;align-items:flex-end;padding:18px;color:#fff;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.14);background-size:cover;background-position:center}
.widget.big{min-height:260px}
.widget .wq{font-family:'Caveat',cursive;font-size:26px;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.widget .wsub{font-size:13px;opacity:.9;margin-top:4px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.book{position:relative;border-radius:8px 16px 16px 8px;min-height:190px;padding:16px 14px 14px 24px;color:#fff;overflow:hidden;box-shadow:0 10px 22px rgba(20,25,60,.22);cursor:pointer;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .18s ease}
.book:hover{transform:translateY(-3px) rotate(-.4deg)}
.book-spine{position:absolute;left:0;top:0;bottom:0;width:12px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.12));border-radius:8px 0 0 8px}
.book-sticker{position:absolute;top:10px;right:10px;font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.book-title{font-size:19px;font-weight:700;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.book-sub{font-size:12px;opacity:.9;margin-top:2px}
.book-meta{font-size:11px;opacity:.8;margin-top:8px}
.book .del{position:absolute;top:6px;left:16px;border:0;background:rgba(0,0,0,.35);color:#fff;border-radius:8px;padding:2px 6px;cursor:pointer}
.rep-more{margin-top:8px;padding:10px;border-radius:12px;background:rgba(0,0,0,.03)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid rgba(0,0,0,.15);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:#3d5ba9;color:#fff;border-color:#3d5ba9}
label.rad{display:block;font-size:14px;margin:2px 0}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid small{text-align:center;opacity:.6;font-size:11px}
.calcell{position:relative;border:0;background:rgba(255,255,255,.6);border-radius:10px;min-height:42px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.calcell.out{opacity:.35}
.calcell.today{outline:2px solid #3d5ba9}
.calcell.sel{background:#3d5ba9;color:#fff}
.calcell i{position:absolute;bottom:3px;right:5px;font-size:10px;font-style:normal;opacity:.85}
.browser-bar{display:flex;gap:8px}
.browser-bar input{flex:1;padding:10px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.15);font-size:15px}
.bm-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bm{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.75);border-radius:14px;padding:10px 12px}
.bm .grow{flex:1;min-width:0;overflow:hidden}
.bm small{display:block;opacity:.65;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;background:rgba(61,91,169,.12);color:#3d5ba9;border-radius:999px;padding:2px 9px;font-size:11px}

.badge.skip{background:rgba(0,0,0,.1);color:#555}

function normalizeItem(i){
  const o=Object.assign({reminders:[],done:false,priority:'',list:'',duration:0,body:'',source:'flowstate'},i||{});
  if(!Array.isArray(o.reminders))o.reminders=[];
  if(!Array.isArray(o.exdates))o.exdates=[];
  if(!o.overrides||typeof o.overrides!=='object')o.overrides={};
  if(o.repeat){try{o.repeat=FSRec.normalise(o.repeat)}catch(e){o.repeat=null}}

function migrate(x){
  const d=JSON.parse(JSON.stringify(DEF));
  if(!x||typeof x!=='object'){d.dashboard=DASH_DEF.map(s=>Object.assign({},s));return d}
  const out=Object.assign(d,x);

  out.settings.bg=Object.assign({},DEF.settings.bg,(x.settings||{}).bg||{});
  out.settings.widget=Object.assign({},DEF.settings.widget,(x.settings||{}).widget||{});
  ['items','classes','notifs','templates','images','bookmarks','recordings','quotes'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[]});
  if(!out.classes.length)out.classes=JSON.parse(JSON.stringify(DEF.classes));
  out.classes=out.classes.map((c,n)=>Object.assign({order:n,style:'photo',stickers:[],font:'',bg2:''},c));

}

/* ---------- expandable text ---------- */
function expandable(text,limit){
  const t=String(text==null?'':text);
  if(!t)return '';
  const id='x'+fsUid();
  if(t.length<=(limit||260))return `<div class="body">${esc(t)}</div>`;
  return `<div class="body clamp" id="${id}">${esc(t)}</div><button class="expbtn" data-exp="${id}" onclick="toggleExp(this)">Show more ▾</button>`;
}
function toggleExp(btn){
  const el=document.getElementById(btn.dataset.exp);if(!el)return;
  const open=el.classList.toggle('open');
  btn.textContent=open?'Show less ▴':'Show more ▾';
}

/* ---------- offline blob store (images + audio survive storage limits) ---------- */
const BLOBS={
  db:null,
  open(){return new Promise((res,rej)=>{
    if(this.db)return res(this.db);
    try{
      const r=indexedDB.open('flowstate-blobs',1);
      r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files')};
      r.onsuccess=()=>{this.db=r.result;res(this.db)};
      r.onerror=()=>rej(r.error);
    }catch(e){rej(e)}
  })},
  async put(key,blob){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,key);tx.oncomplete=()=>res(key);tx.onerror=()=>rej(tx.error)})},
  async get(key){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const rq=tx.objectStore('files').get(key);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error)})},
  async del(key){const db=await this.open();return new Promise(res=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(key);tx.oncomplete=()=>res(true)})},
  async url(key){const b=await this.get(key);return b?URL.createObjectURL(b):''}
};

/* ---------- native bridge (Android) ---------- */
function native(){return window.FlowStateNative||null}
function isNative(){return !!native()}
async function readSharedAudio(fileId){
  const b=native();if(!b||!b.readSharedChunk)return null;
  const parts=[];let off=0;const size=Number(b.sharedSize(fileId)||0);
  while(off<size){const chunk=b.readSharedChunk(fileId,off,524288);if(!chunk)break;parts.push(chunk);off+=524288}
  const bin=atob(parts.join(''));const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:'audio/*'});
}

/* ---------- recurrence helpers ---------- */
function itemOccurrences(i,from,to){
  if(!i.repeat||!i.repeat.freq)return i.due?[{key:FSRec.dk(new Date(i.due)),date:new Date(i.due),item:i}]:[];
  try{return FSRec.occurrences(i,from||null,to||null)}catch(e){return []}
}
function itemsOnDay(k){
  const day=new Date(k+'T00:00:00'),end=new Date(k+'T23:59:59');
  const out=[];
  D.items.forEach(i=>{
    if(!i.due)return;
    if(i.repeat&&i.repeat.freq){itemOccurrences(i,day,end).forEach(o=>out.push({item:i,occ:o.key,date:o.date}))}
    else{const d=new Date(i.due);if(FSRec.dk(d)===k)out.push({item:i,occ:null,date:d})}
  });
  return out.sort((a,b)=>a.date-b.date);
}
function upcomingItems(days){
  const from=new Date();const to=new Date(Date.now()+(days||14)*864e5);const out=[];
  D.items.forEach(i=>{
    if(!i.due||i.done)return;
    if(i.repeat&&i.repeat.freq){itemOccurrences(i,from,to).forEach(o=>out.push({item:i,occ:o.key,date:o.date}))}
    else{const d=new Date(i.due);if(d>=from&&d<=to)out.push({item:i,occ:null,date:d})}
  });
  return out.sort((a,b)=>a.date-b.date);
}
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ORD=['first','second','third','fourth','last'];
function repeatEditor(r){
  r=r||{freq:'none'};
  const freq=r.freq||'none';
  const wds=Array.isArray(r.byWeekday)?r.byWeekday:[];
  const mode=r.monthMode||(r.bySetPos?'nth':'day');

    <option value="monthly" ${freq==='monthly'?'selected':''}>Every month</option>
    <option value="daily" ${freq==='daily'?'selected':''}>Every day</option>
    <option value="yearly" ${freq==='yearly'?'selected':''}>Every year</option>
  </select></label>
  <div id="rep-more" class="rep-more">
    <label>Every <input id="f-int" type="number" min="1" max="52" value="${r.interval||1}" style="width:70px"> ${freq==='weekly'?'week(s)':freq==='monthly'?'month(s)':freq==='yearly'?'year(s)':'day(s)'}</label>
    <div id="rep-wd"><small>On these days</small><div class="chips">${WD.map((d,i)=>`<button type="button" class="chip ${wds.includes(i)?'on':''}" data-wd="${i}" onclick="this.classList.toggle('on')">${d}</button>`).join('')}</div></div>
    <div id="rep-mo"><small>Monthly pattern</small>
      <label class="rad"><input type="radio" name="mmode" value="day" ${mode==='day'?'checked':''} onchange="repUI()"> Same day number</label>
      <label class="rad"><input type="radio" name="mmode" value="nth" ${mode==='nth'?'checked':''} onchange="repUI()"> Nth weekday</label>
      <div id="rep-nth" class="row"><select id="f-nth">${ORD.map((o,i)=>`<option value="${i+1}" ${String(r.bySetPos)===String(i+1)?'selected':''}>${o}</option>`).join('')}<option value="-1" ${String(r.bySetPos)==='-1'?'selected':''}>last</option></select><select id="f-nthd">${DAYL.map((d,i)=>`<option value="${i}" ${String(r.byWeekday&&r.byWeekday[0])===String(i)?'selected':''}>${d}</option>`).join('')}</select></div>
    </div>
    <label>Ends <select id="f-endmode" onchange="repUI()"><option value="never" ${!r.until&&!r.count?'selected':''}>Never</option><option value="until" ${r.until?'selected':''}>On date</option><option value="count" ${r.count?'selected':''}>After N times</option></select></label>
    <div class="row"><input id="f-until" type="date" value="${r.until||''}" style="display:${r.until?'block':'none'}"><input id="f-count" type="number" min="1" value="${r.count||''}" placeholder="Times" style="width:90px;display:${r.count?'block':'none'}"></div>
  </div></div>`;
}
function repUI(){
  const f=$('#f-rep');if(!f)return;const v=f.value;
  const more=$('#rep-more');if(more)more.style.display=v==='none'?'none':'block';
  const wd=$('#rep-wd');if(wd)wd.style.display=v==='weekly'?'block':'none';
  const mo=$('#rep-mo');if(mo)mo.style.display=v==='monthly'?'block':'none';
  const nth=$('#rep-nth');if(nth){const m=document.querySelector('input[name="mmode"]:checked');nth.style.display=(v==='monthly'&&m&&m.value==='nth')?'flex':'none'}
  const em=$('#f-endmode');if(em){const u=$('#f-until'),c=$('#f-count');if(u)u.style.display=em.value==='until'?'block':'none';if(c)c.style.display=em.value==='count'?'block':'none'}
}
function readRepeat(){
  const f=$('#f-rep');if(!f||f.value==='none')return null;
  const rep={freq:f.value,interval:Math.max(1,Number(($('#f-int')||{}).value||1))};
  if(f.value==='weekly')rep.byWeekday=[...document.querySelectorAll('#rep-wd .chip.on')].map(b=>Number(b.dataset.wd));
  if(f.value==='monthly'){
    const m=document.querySelector('input[name="mmode"]:checked');
    rep.monthMode=m?m.value:'day';
    if(rep.monthMode==='nth'){rep.bySetPos=Number($('#f-nth').value);rep.byWeekday=[Number($('#f-nthd').value)]}
  }
  const em=$('#f-endmode');
  if(em&&em.value==='until'&&$('#f-until').value)rep.until=$('#f-until').value;
  if(em&&em.value==='count'&&$('#f-count').value)rep.count=Math.max(1,Number($('#f-count').value));
  return FSRec.normalise(rep);
}

/* ---------- templates ---------- */
const TPL_DEF=[
  {id:'tpl-work',name:'Work shift',icon:'💼',cat:'work',title:'Work',start:'09:00',end:'17:00',repeat:{freq:'weekly',interval:1,byWeekday:[1,2,3,4,5]}},

function saveForm(){
  const title=($('#f-title')||{}).value||'';
  if(!title.trim()){toast('Give it a title first.');return}
  const due=($('#f-due')||{}).value||'';
  const rep=readRepeat();
  const patch={type:($('#f-type')||{}).value||'event',title:title.trim(),cat:($('#f-cat')||{}).value||'home',cls:($('#f-cls')||{}).value||'',priority:($('#f-pri')||{}).value||'',body:($('#f-body')||{}).value||'',due,repeat:rep};
  const tplName=($('#f-tplname')||{}).value;
  let item=FORM.id?D.items.find(x=>x.id===FORM.id):null;
  if(item){
    Object.assign(item,patch);item.updated=Date.now();
    if(rep&&!item.seriesStart)item.seriesStart=due.slice(0,10);
    save();sendGoogleSync('upsert',item);
  }else{
    item=normalizeItem(Object.assign({id:fsUid(),created:Date.now()},patch));
    if(rep)item.seriesStart=due.slice(0,10);
    D.items.push(item);save();sendGoogleSync('upsert',item);
  }
  if(tplName&&tplName.trim()){
    D.templates=(D.templates||TPL_DEF.slice());
    D.templates.push({id:'tpl-'+fsUid(),name:tplName.trim(),icon:'🔁',cat:patch.cat,title:patch.title,start:due.slice(11,16)||'09:00',end:'',repeat:rep});save();
  }
  closeSheet();render();toast('Saved');
}

/* ---------- series scope actions ---------- */
function askSeriesScope(itemId,occ,action){
  S.seriesCtx={itemId,occ,action};
  sheet(`<h2>This is a repeating event</h2><p class="empty">What should change?</p>
  <div class="row wrap">
    <button class="primary" onclick="seriesDo('one')">Only ${esc(occ||'this occurrence')}</button>
    <button onclick="seriesDo('future')">This and following</button>
    <button class="danger" onclick="seriesDo('all')">Entire series</button>
    <button onclick="closeSheet()">Cancel</button>
  </div>`);
}
function seriesDo(scope){
  const c=S.seriesCtx;if(!c)return closeSheet();
  const item=D.items.find(x=>x.id===c.itemId);if(!item)return closeSheet();
  if(c.action==='skip'){
    if(scope==='one'){FSRec.skipOccurrence(item,c.occ);toast('Occurrence skipped. The series continues.')}
    else if(scope==='future'){item.repeat=Object.assign({},item.repeat,{until:FSRec.dk(new Date(new Date(c.occ+'T12:00').getTime()-864e5))});toast('Series ends before this date.')}
    else{const idx=D.items.indexOf(item);if(idx>=0)D.items.splice(idx,1);toast('Series deleted.')}
    save();sendGoogleSync('upsert',item);closeSheet();render();return;
  }
  if(c.action==='delete'){
    if(scope==='one'){FSRec.skipOccurrence(item,c.occ);toast('Occurrence removed.')}
    else if(scope==='future'){item.repeat=Object.assign({},item.repeat,{until:FSRec.dk(new Date(new Date(c.occ+'T12:00').getTime()-864e5))});toast('Remaining occurrences removed.')}
    else{D.items=D.items.filter(x=>x.id!==item.id);toast('Entire series deleted.')}
    save();sendGoogleSync(scope==='all'?'delete':'upsert',item,item.id);closeSheet();render();return;
  }
  closeSheet();
}
function skipOccurrenceFlow(id,occ){
  const item=D.items.find(x=>x.id===id);if(!item)return;
  if(!item.repeat){toast('This event does not repeat.');return}
  askSeriesScope(id,occ,'skip');
}
function moveOccurrenceFlow(id,occ){
  const item=D.items.find(x=>x.id===id);if(!item||!occ)return;
  sheet(`<h2>Move this occurrence</h2><label>New date and time <input id="occ-due" type="datetime-local" value="${esc(String(item.due||'').slice(0,16))}"></label>
  <div class="row"><button class="primary" onclick="doMoveOccurrence('${id}','${occ}')">Move</button><button onclick="closeSheet()">Cancel</button></div>`);
}
function doMoveOccurrence(id,occ){
  const item=D.items.find(x=>x.id===id);const v=($('#occ-due')||{}).value;
  if(!item||!v)return;
  FSRec.overrideOccurrence(item,occ,{due:v});save();sendGoogleSync('upsert',item);closeSheet();render();toast('Occurrence moved. Other dates are unchanged.');
}

function calMini(){
  const base=S.month||new Date(new Date().getFullYear(),new Date().getMonth(),1);
  const y=base.getFullYear(),m=base.getMonth();
  const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
  const cells=[];
  for(let i=0;i<42;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const k=FSRec.dk(d);
    const n=itemsOnDay(k).length;
    const cls=[d.getMonth()===m?'':'out',k===S.sel?'sel':'',k===FSRec.dk(new Date())?'today':''].join(' ');
    cells.push(`<button class="calcell ${cls}" onclick="selDay('${k}')"><span>${d.getDate()}</span>${n?`<i>${n}</i>`:''}</button>`);
  }
  return `<div class="calhead"><button onclick="shiftMonth(-1)" title="Previous month">‹</button><b>${first.toLocaleString(undefined,{month:'long',year:'numeric'})}</b><button onclick="shiftMonth(1)" title="Next month">›</button></div>

function shade(hex){
  const h=String(hex).replace('#','');const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);
  const r=Math.max(0,((n>>16)&255)-38),g=Math.max(0,((n>>8)&255)-38),b=Math.max(0,(n&255)-38);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function setBookCover(file){

  const fr=new FileReader();

    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);

  fr.readAsDataURL(file);

async function importFromShare(){
  if(!isNative()){toast('Use the Android app to receive shared recordings.');return}
  let shares=[];
  try{shares=JSON.parse(native().pendingShares()||'[]')}catch(e){shares=[]}
  if(!shares.length){toast('Nothing waiting. Share a file to FlowState first.');return}
  let added=0;
  for(const sh of shares){
    const id=fsUid();
    const rec=normalizeItem({id,type:'recording',cat:'school',title:sh.name||'Shared recording',created:Date.now(),source:'share',transcript:sh.transcriptText||''});
    if(sh.hasAudio){
      try{const blob=await readSharedAudio(sh.id);if(blob){const key='audio-'+id;await BLOBS.put(key,blob);rec.audioKey=key;rec.mime=sh.mime||'';rec.size=sh.size||0}}catch(e){}
    }
    D.items.push(rec);added++;
    try{native().clearShare(sh.id)}catch(e){}

  D.items.push(rec);save();closeSheet();render();toast('Transcript saved');
}
function extractTasks(text){
  const out=[];
  const lines=String(text||'').split(/\n|(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
  const dueRx=/(due|deadline|submit|hand in|by|before)\b[^.]{0,40}?\b(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?|(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}|\d{4}-\d{2}-\d{2})/i;
  const taskRx=/(homework|assignment|essay|quiz|test|exam|project|read|reading|chapter|worksheet|lab|study|prepare|review|finish|complete|submit|bring|write)/i;
  lines.forEach(l=>{
    if(!taskRx.test(l))return;
    let due='';const m=l.match(dueRx);
    if(m&&m[2]){
      const raw=m[2];
      const d=new Date(raw);
      if(!isNaN(d))due=FSRec.dk(d)+'T17:00';
    }
    out.push({title:l.slice(0,120),due});
  });
  return out.slice(0,12);
}
function summarizeRecording(id){
  const r=D.items.find(x=>x.id===id);if(!r||!r.transcript){toast('Add a transcript first.');return}
  const tasks=extractTasks(r.transcript);
  const sentences=r.transcript.replace(/\s+/g,' ').split(/(?<=[.!?])\s/).filter(Boolean);
  const summary=(r.aiSummary||sentences.slice(0,4).join(' ')).slice(0,900);
  r.summary=summary;r.tasksFound=tasks;save();
  sheet(`<h2>Summary</h2>${expandable(summary,400)}
  <h3>Possible tasks and due dates</h3>
  ${tasks.length?tasks.map((t,i)=>`<label class="row" style="align-items:flex-start"><input type="checkbox" class="tk" data-i="${i}" checked><span>${esc(t.title)}${t.due?'<br><small>due '+esc(t.due.replace('T',' '))+'</small>':''}</span></label>`).join(''):'<p class="empty">No tasks found. You can add them manually.</p>'}
  <p class="empty">Created on this device with the built-in offline reader.${secGet(SEC_AI)?' Your own AI key is stored and used when you tap “Use AI”.':''}</p>
  <div class="row wrap"><button class="primary" onclick="acceptTasks('${id}')">Add selected as tasks</button>${secGet(SEC_AI)?`<button onclick="aiSummarize('${id}')">Use AI</button>`:''}<button onclick="closeSheet()">Close</button></div>`);

  const r=D.items.find(x=>x.id===id);if(!r||!r.tasksFound)return;
  const chosen=[...document.querySelectorAll('.tk:checked')].map(x=>Number(x.dataset.i));
  let n=0;
  chosen.forEach(i=>{
    const t=r.tasksFound[i];if(!t)return;
    const it=normalizeItem({id:fsUid(),type:'homework',cat:r.cat||'school',title:t.title,due:t.due||'',created:Date.now(),body:'From recording: '+r.title});
    D.items.push(it);n++;
  });
  save();closeSheet();render();toast(n+' task(s) added');
}
async function aiSummarize(id){
  const r=D.items.find(x=>x.id===id);const key=secGet(SEC_AI);const url=secGet('flowstate.aiUrl');
  if(!key||!url){toast('Add your AI endpoint and key in Settings → AI.');return}
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({task:'summarize',text:r.transcript})});
    const out=await res.json();
    r.aiSummary=out.summary||out.text||'';save();summarizeRecording(id);

// ---- Google Calendar sync ------------------------------------------------
// No endpoint, token, API key or client secret is stored in this file. The
// user supplies their own relay endpoint + token in Settings; they live in the
// Android Keystore via the native bridge (or this browser's localStorage on
// this device only) and are never committed to the repository.
const SEC_URL='flowstate.syncUrl',SEC_TOKEN='flowstate.syncToken',SEC_AI='flowstate.aiKey';
function secGet(k){
  try{if(window.FlowStateNative&&FlowStateNative.readSecret){const v=FlowStateNative.readSecret(k);if(v)return v}}catch(e){}
  try{return localStorage.getItem('fs-sec-'+k)||''}catch(e){return ''}
}
function secSet(k,v){
  try{if(window.FlowStateNative&&FlowStateNative.saveSecret)FlowStateNative.saveSecret(k,String(v==null?'':v))}catch(e){}
  try{localStorage.setItem('fs-sec-'+k,String(v==null?'':v));return true}catch(e){return false}
}
function syncConfigured(){return !!(secGet(SEC_URL)&&secGet(SEC_TOKEN))}
function plainItem(i){const c=Object.assign({},i);delete c.audio;delete c.transcript;delete c.img;return c}
async function syncPost(action,extra){
  const url=secGet(SEC_URL),token=secGet(SEC_TOKEN);
  if(!url||!token)throw new Error('Add your sync endpoint and token in Settings first.');
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(Object.assign({token,action},extra||{}))});
  if(!res.ok)throw new Error('Sync endpoint returned '+res.status);
  const txt=await res.text();
  try{return JSON.parse(txt)}catch(e){return {ok:true,raw:txt}}
}
function sendGoogleSync(action,item,id){
  if(!D.settings.googleSync)return;
  D.settings.pendingGoogleSync=D.settings.pendingGoogleSync||[];
  D.settings.pendingGoogleSync.push({action,item:item?plainItem(item):null,id:id||null});
  if(D.settings.pendingGoogleSync.length>300)D.settings.pendingGoogleSync=D.settings.pendingGoogleSync.slice(-300);
  save();flushGoogleSync();
}
async function flushGoogleSync(){
  if(!D.settings.googleSync||!navigator.onLine||!syncConfigured()||SYNC_BUSY)return;
  const q=(D.settings.pendingGoogleSync||[]).slice();if(!q.length)return;
  SYNC_BUSY=true;D.settings.pendingGoogleSync=[];save();
  for(const job of q){
    try{await syncPost(job.action,{item:job.item,id:job.id,calendar:D.settings.syncCalendar||'FlowState'})}
    catch(e){D.settings.pendingGoogleSync.push(job);break}
  }
  D.settings.pendingGoogleSync=D.settings.pendingGoogleSync.slice(-300);
  SYNC_BUSY=false;save();updateSyncBadge();
}
function itemFingerprint(i){return String(i.title||'').trim().toLowerCase()+'|'+String(i.due||'').slice(0,16)}
function findDuplicate(r){
  const ext=r.uid||r.googleId||r.icsUid||'';
  if(ext){const hit=D.items.find(x=>x.googleId===ext||x.uid===ext);if(hit)return hit}
  const fp=itemFingerprint({title:r.title,due:r.due||r.start||''});
  return D.items.find(x=>!x.googleId&&itemFingerprint(x)===fp)||null;
}
function mergeRemote(list,source){
  let added=0,updated=0,skipped=0;
  (Array.isArray(list)?list:[]).forEach(r=>{
    if(!r||!r.title)return;
    const ext=r.uid||r.googleId||r.icsUid||'';
    const due=r.due||r.start||'';
    const existing=findDuplicate(r);
    if(existing){
      const changed=existing.title!==r.title||String(existing.due||'')!==String(due);
      if(changed){
        existing.title=r.title;existing.due=due||existing.due;
        if(r.body!=null&&r.body!=='')existing.body=r.body;
        if(r.repeat)existing.repeat=FSRec.normalise(r.repeat);
        existing.updated=Date.now();updated++;
      }else skipped++;
      existing.googleId=existing.googleId||ext;existing.source=existing.source||source;
      if(r.calendar)existing.calendar=r.calendar;
      return;
    }
    D.items.push(normalizeItem({id:fsUid(),type:r.type||'event',cat:r.cat||'home',title:r.title,body:r.body||'',due,created:Date.now(),googleId:ext,uid:ext,source,calendar:r.calendar||'',repeat:r.repeat?FSRec.normalise(r.repeat):null}));
    added++;
  });
  if(added||updated)save();
  return {added,updated,skipped};
}
async function syncPull(silent){
  if(!syncConfigured()){if(!silent)toast('Add your sync endpoint and token in Settings first.');return null}
  try{
    const out=await syncPost('pull',{since:D.settings.syncLast||0});
    const r=mergeRemote((out&&(out.items||out.events))||[],'google');
    D.settings.syncLast=Date.now();save();
    if(!silent){render();toast('Google → FlowState: '+r.added+' new, '+r.updated+' updated, '+r.skipped+' unchanged')}
    return r;
  }catch(e){if(!silent)toast('Pull failed: '+e.message);return null}
}
async function syncPushAll(silent){
  if(!syncConfigured()){if(!silent)toast('Add your sync endpoint and token in Settings first.');return}
  const items=D.items.filter(i=>i.type!=='recording'&&i.type!=='note').map(plainItem);
  try{
    const out=await syncPost('push',{items});
    const r=mergeRemote((out&&(out.items||out.events))||[],'google');
    D.settings.syncLast=Date.now();save();render();
    if(!silent)toast('Sent '+items.length+' items · '+r.added+' came back from Google');
  }catch(e){if(!silent)toast('Push failed: '+e.message)}
}

  D.settings.googleSync=true;save();render();syncPushAll();

  const ec=FORM.id&&D.classes.find(x=>x.id===FORM.id);const o={name,icon:val('icon').trim()||'📘',color:CCOL,size:(+val('size'))||1,img:FORM.img||null};if(ec)Object.assign(ec,o);else D.classes.push(Object.assign({id:uid()},o));
  save();closeSheet();render();
}
function delClass(id){
  const c=D.classes.find(x=>x.id===id);if(!c)return;
  confirmSheet(`Delete ${c.name} and all of its summaries and homework?`,()=>{
    D.classes=D.classes.filter(x=>x.id!==id);D.items.filter(i=>i.cls===id).forEach(i=>sendGoogleSync('delete',null,i.id));D.items=D.items.filter(i=>i.cls!==id);
    if(S.cls===id)S.cls=null;save();render();
  });
}
function confirmSheet(msg,fn){CONF=fn;sheet(`<p>${esc(msg)}</p><div class="row"><button class="danger" onclick="CONF();closeSheet()">Yes, delete</button><button onclick="closeSheet()">Cancel</button></div>`)}

function openDetailLegacy(id){
  const i=D.items.find(x=>x.id===id);if(!i)return;
  sheet(`<small>${esc(LABEL[i.type]||'')}${i.cat?' · '+CATS[i.cat]:''}${i.cls?' · '+esc(clsName(i.cls)):''}</small>
  <h2>${esc(i.title)}</h2>
  ${i.due?`<p>Due ${esc(fmt(i.due))}</p>`:''}
  ${i.reminders&&i.reminders.length?`<p>Reminders: ${i.reminders.join(', ')} min before</p>`:''}
  ${i.duration?`<p>Length: ${fmtDur(i.duration*1000)}</p>`:''}
  <div class="body">${esc(i.body)}</div>
  <div class="row">${i.type==='recording'?'':`<button onclick="openForm(null,'${id}')">Edit</button>`}${i.due?`<button onclick="icsFor('${id}')">Calendar file</button>`:''}<button class="danger" onclick="delItem('${id}')">Delete</button><button onclick="closeSheet()">Close</button></div>`);
}
function delItem(id){
  const i=D.items.findIndex(x=>x.id===id);if(i<0)return;
  const [it]=D.items.splice(i,1);
  save();sendGoogleSync('delete',null,it.id);closeSheet();render();
  toast('Deleted "'+it.title+'"',()=>{D.items.splice(i,0,it);save();sendGoogleSync('upsert',it);render()});
}
function toggleDone(id){const i=D.items.find(x=>x.id===id);if(i){i.done=!i.done;save();sendGoogleSync('upsert',i);render()}}

function openRec(){
  if(REC)return showRec();
  sheet(`<h2>Quick recording</h2><p>Where should this go?</p>
  <div class="row">${['school','work','deyc','personal'].map(c=>`<button class="chip${c===RC?' on':''}" data-c="${c}" onclick="pickRec(this)">${CATS[c]}</button>`).join('')}</div>
  <input id="rnote" placeholder="Short note (optional)">
  <div class="row"><button class="primary" onclick="startRec()">Start</button><button onclick="closeSheet()">Cancel</button></div>`);
}
function pickRec(b){RC=b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b))}
function startRec(){REC={cat:RC,note:val('rnote'),start:Date.now()};REC.iv=setInterval(updRec,1000);showRec()}
function showRec(){
  sheet(`<h2>Recording to ${CATS[REC.cat]}</h2><p class="big" id="rtime">${fmtDur(Date.now()-REC.start)}</p>
  <p class="empty">This saves the length and your note. Audio capture and AI summaries are not connected yet.</p>
  <div class="row"><button class="danger" onclick="stopRec()">Stop and save</button></div>`);
}
function updRec(){const el=$('#rtime');if(el&&REC)el.textContent=fmtDur(Date.now()-REC.start)}
function stopRec(){
  clearInterval(REC.iv);
  const secs=Math.round((Date.now()-REC.start)/1000);
  D.items.push({id:uid(),type:'recording',cat:REC.cat,cls:null,title:'Recording '+new Date().toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),body:REC.note,due:null,reminders:[],done:false,duration:secs,created:Date.now()});
  REC=null;save();closeSheet();render();
}

/* Global search lives in one place only (see openSearch/searchInto/runSearch above).
   A duplicate definition here used to shadow it, which left the search sheet with no results area. */
function exportData(){sheet(`<h2>Backup</h2><p class="empty">Copy this text and keep it somewhere safe. Use Import data to restore it.</p><textarea id="bk" style="min-height:260px">${esc(JSON.stringify(D))}</textarea><div class="row"><button class="primary" onclick="copyBk()">Copy</button><button onclick="closeSheet()">Close</button></div>`)}
function copyBk(){
  const t=$('#bk');const no=()=>{t.select();toast('Press and hold the text to copy it')};
  try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),no)}catch(e){no()}
}
function importData(){sheet(`<h2>Restore backup</h2><p class="empty">Paste a backup here. This replaces everything in the app.</p><textarea id="bk" placeholder="Paste backup text"></textarea><div class="row"><button class="danger" onclick="restoreData()">Restore</button><button onclick="closeSheet()">Cancel</button></div>`)}
function restoreData(){
  let x;try{x=JSON.parse($('#bk').value)}catch(e){return toast('That is not a valid backup')}
  if(!x||!Array.isArray(x.items)||!Array.isArray(x.classes))return toast('That is not a FlowState backup');
  D=Object.assign(clone(DEF),x);D.settings=Object.assign(clone(DEF.settings),x.settings||{});
  save();closeSheet();render();toast('Backup restored');
}
function icsForLegacy(id){
  const i=D.items.find(x=>x.id===id);if(!i||!i.due)return;
  const s=new Date(i.due),e=new Date(s.getTime()+36e5),p=n=>String(n).padStart(2,'0');
  const f=d=>d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FlowState//EN','BEGIN:VEVENT','UID:'+i.id+'@flowstate','DTSTART:'+f(s),'DTEND:'+f(e),'SUMMARY:'+i.title,'DESCRIPTION:'+(i.body||'').replace(/\s+/g,' '),'END:VEVENT','END:VCALENDAR'].join('\r\n');
  sheet(`<h2>Calendar file</h2><p class="empty">Download the file and open it to add this to your calendar app. If the download does nothing in this preview, copy the text into a file named event.ics.</p><textarea id="bk" style="min-height:200px">${esc(ics)}</textarea><div class="row"><button class="primary" onclick="dlIcs()">Download .ics</button><button onclick="copyBk()">Copy</button><button onclick="openDetail('${id}')">Back</button></div>`);
}
function dlIcs(n){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#bk').value],{type:'text/calendar'}));a.download=n||'event.ics';document.body.appendChild(a);a.click();a.remove()}
function editClass(id){
  const c=D.classes.find(x=>x.id===id);if(!c)return;
  classForm();FORM.id=id;
  $('#f-name').value=c.name;$('#f-icon').value=c.icon;CCOL=c.color;FORM.img=c.img||null;$('#f-size').value=c.size||1;if(c.img)$('#f-prev').innerHTML='<span style="display:inline-flex;width:64px;height:64px;overflow:hidden;border-radius:50%"><img src="'+c.img+'" style="display:block;width:100%;height:100%;object-fit:cover;object-position:center"></span>';
  document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x.dataset.c===c.color));
}
let FOC=null;
function openFocus(){if(!FOC)FOC={work:true,left:25*60,iv:null};showFocus()}
function showFocus(){sheet(`<h2>${FOC.work?'Focus':'Break'}</h2><p class="big" id="ftime">${fmtDur(FOC.left*1000)}</p><div class="row"><button class="primary" onclick="focusToggle()">${FOC.iv?'Pause':'Start'}</button><button onclick="focusSwap()">Skip to ${FOC.work?'break':'focus'}</button><button onclick="focusReset()">Reset</button><button onclick="closeSheet()">Hide</button></div><p class="empty">Runs while this page is open.</p>`)}
function focusTick(){
  if(!FOC)return;
  FOC.left--;
  if(FOC.left<=0){FOC.work=!FOC.work;FOC.left=(FOC.work?25:5)*60;toast(FOC.work?'Break over, back to focus':'Focus done. Take a 5 minute break');if($('#ftime'))showFocus();return}
  const el=$('#ftime');if(el)el.textContent=fmtDur(FOC.left*1000);
}
function focusToggle(){if(FOC.iv){clearInterval(FOC.iv);FOC.iv=null}else FOC.iv=setInterval(focusTick,1000);showFocus()}
function focusSwap(){FOC.work=!FOC.work;FOC.left=(FOC.work?25:5)*60;showFocus()}
function focusReset(){if(FOC&&FOC.iv)clearInterval(FOC.iv);FOC=null;closeSheet()}
function openQuick(){
  const cat=['school','work','deyc','personal'].includes(S.tab)?S.tab:'school';
  FORM={type:'summary',id:null};
  sheet(`<h2>Quick paste summary</h2><label>Category <select id="f-cat" onchange="quickCls()">${['school','work','deyc','personal'].map(c=>`<option value="${c}" ${c===cat?'selected':''}>${CATS[c]}</option>`).join('')}</select></label><div id="qcls">${quickClsHtml(cat)}</div><textarea id="f-body" placeholder="Paste the summary and key points here" style="min-height:260px"></textarea><div class="row"><button onclick="pasteClip()">Paste from clipboard</button></div><div class="row"><button class="primary" onclick="saveQuick()">Save</button><button onclick="closeSheet()">Cancel</button></div>`);
}
function quickClsHtml(cat){return cat==='school'?`<label>Class <select id="f-cls"><option value="">None</option>${D.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>`:''}
function quickCls(){$('#qcls').innerHTML=quickClsHtml(val('cat'))}
function pasteClip(){try{navigator.clipboard.readText().then(t=>{$('#f-body').value=t},()=>toast('Use press and hold to paste'))}catch(e){toast('Use press and hold to paste')}}
function saveQuick(){
  const body=val('body').trim();if(!body)return toast('Paste something first');
  const first=(body.split('\n').find(l=>l.trim())||'Summary').replace(/^[\s#*•-]+/,'').trim().slice(0,60)||'Summary';
  const cat=val('cat');
  const item={id:uid(),type:'summary',cat,cls:(cat==='school'&&val('cls'))||null,title:first,body,due:null,reminders:[],done:false,created:Date.now()};
  D.items.push(item);save();sendGoogleSync('upsert',item);closeSheet();render();toast('Summary saved');
}
function exportRemindersLegacy(){
  const p=n=>String(n).padStart(2,'0');
  const f=d=>d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FlowState//EN'];
  D.items.filter(i=>i.due&&!i.done&&!isNaN(new Date(i.due))).forEach(i=>{
    const s=new Date(i.due),e=new Date(s.getTime()+36e5);
    L.push('BEGIN:VEVENT','UID:'+i.id+'@flowstate','DTSTART:'+f(s),'DTEND:'+f(e),'SUMMARY:'+i.title);
    (i.reminders||[]).forEach(m=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+i.title,'TRIGGER:-PT'+m+'M','END:VALARM'));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  sheet(`<h2>Reminders file</h2><p class="empty">Open this file to add your upcoming items and their reminders to your calendar app. Those reminders fire even when FlowState is closed. Export again after you add new items.</p><textarea id="bk" style="min-height:200px">${esc(L.join('\r\n'))}</textarea><div class="row"><button class="primary" onclick="dlIcs('flowstate-reminders.ics')">Download .ics</button><button onclick="copyBk()">Copy</button><button onclick="closeSheet()">Close</button></div>`);
}
function clsIco(c){return c.img?`<img src="${c.img}" alt="">`:esc(c.icon)}
function pickClassImg(file){
  if(!file)return toast('No picture chosen');
  const fr=new FileReader();
  fr.onerror=()=>toast('Could not read that file');
  fr.onload=()=>{const im=new Image();im.onerror=()=>toast('That picture will not open. Try a JPG or PNG.');im.onload=()=>{const sc=Math.min(1,256/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);FORM.img=c.toDataURL('image/png');const pv=$('#f-prev');if(pv)pv.innerHTML='<img src="'+FORM.img+'" style="width:64px;height:64px;object-fit:cover;border-radius:50%">'};im.src=fr.result};
  fr.readAsDataURL(file);
}
function addNotif(text){
  D.notifs.push({id:uid(),text,time:Date.now(),read:false});
  D.notifs=D.notifs.slice(-100);save();updateBell();
  if(!D.dnd){
    toast(text);
    try{if('Notification' in window&&Notification.permission==='granted')new Notification('FlowState',{body:text})}catch(e){}
  }
}
function askPerm(){
  try{Notification.requestPermission().then(p=>toast('Browser alerts: '+p))}catch(e){toast('Browser alerts are not supported here')}
}
function tick(){
  const now=Date.now();let ch=false;
  D.items.forEach(i=>{
    if(!i.due||!i.reminders||!i.reminders.length)return;
    const due=new Date(i.due).getTime();if(isNaN(due))return;
    i.reminders.forEach(m=>{
      const k=i.id+':'+m,at=due-m*6e4;
      if(D.fired[k]||now<at)return;
      D.fired[k]=1;ch=true;
      if(now-at<6e5)addNotif(i.title+' starts in '+m+' min');
    });
  });
  if(ch)save();
}

function rail_init(){
  $('#rail').onclick=e=>{
    const b=e.target.closest('[data-tab]');if(!b)return;
    const t=b.dataset.tab;
    if(t===S.tab){S.collapsed=!S.collapsed;S.drop=!S.collapsed}
    else{S.tab=t;S.cls=null;S.collapsed=false;S.bubble=null;S.enter=true}
    render();
  };
  let ty=null;const nav=$('#rail');
  nav.addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});
  nav.addEventListener('touchend',e=>{if(ty===null)return;const dy=e.changedTouches[0].clientY-ty;ty=null;if(Math.abs(dy)>60)go(dy<0?1:-1)});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();return}
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
  if(e.key==='ArrowDown')go(1);
  if(e.key==='ArrowUp')go(-1);
});

const cv=$('#blobs'),cx=cv.getContext('2d');
const BL=[[0,0,230,'#ff8fa3'],[1,0,200,'#9db4f0'],[0,1,240,'#8fd3a8'],[1,1,260,'#c39bf0'],[.5,1,160,'#f7c77a'],[.5,0,150,'#7fd6e8']];
let W=0,H=0,T=0;
let PARTS=[];
const ANIMS={bubbles:'Lava bubbles',waves:'Soft waves',stars:'Floating dots',off:'Off'};
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;seedParts()}
function seedParts(){PARTS=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),r:2+Math.random()*4,v:.2+Math.random()*.8,c:PAL[Math.floor(Math.random()*PAL.length)]}))}
function drawBubbles(){
  BL.forEach(([fx,fy,r,c],k)=>{
    const x=fx*W+Math.sin(T*.004+k*2)*70,y=fy*H+Math.cos(T*.005+k)*55;
    const g=cx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,c+'aa');g.addColorStop(1,c+'00');
    cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);cx.fill();
  });
}
function drawWaves(){
  for(let k=0;k<3;k++){
    cx.beginPath();cx.moveTo(0,H);
    for(let x=0;x<=W;x+=20){cx.lineTo(x,H*(.78+k*.07)+Math.sin(x*.008+T*.02+k*1.5)*35)}
    cx.lineTo(W,H);cx.closePath();
    cx.fillStyle=PAL[(k+2)%PAL.length]+'66';cx.fill();
  }
}
function drawDots(sp){
  PARTS.forEach(p=>{
    p.y-=p.v*.0015*sp;if(p.y<0){p.y=1;p.x=Math.random()}
    cx.fillStyle=p.c+'cc';cx.beginPath();cx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);cx.fill();
  });
}
function frame(){
  const sp=D.settings.reduce?0:D.settings.speed;T+=sp;
  cx.clearRect(0,0,W,H);
  const a=D.settings.anim||'bubbles';
  if(a==='bubbles')drawBubbles();
  else if(a==='waves')drawWaves();
  else if(a==='stars')drawDots(sp);
  requestAnimationFrame(frame);
}

window.addEventListener('resize',resize);
resize();rail_init();clock();render();tick();flushGoogleSync();
setInterval(tick,15000);setInterval(clock,1000);
requestAnimationFrame(frame);
